const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let scale=1, offX=0, offY=0;

function resizeCanvas() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const ar = DESIGN_WIDTH / DESIGN_HEIGHT;
  if (ww/wh > ar) { scale = wh/DESIGN_HEIGHT; offX = (ww - DESIGN_WIDTH*scale)/2; offY = 0; }
  else            { scale = ww/DESIGN_WIDTH;  offX = 0; offY = (wh - DESIGN_HEIGHT*scale)/2; }
  canvas.width = ww; canvas.height = wh;
}
window.addEventListener('resize', resizeCanvas);

function withVirtual(fn) {
  ctx.save();
  let shakeX = 0, shakeY = 0;
  if (screenShake.timer > 0) {
    shakeX = (Math.random() - 0.5) * 2 * screenShake.strength;
    shakeY = (Math.random() - 0.5) * 2 * screenShake.strength;
  }
  ctx.translate(offX + shakeX * scale, offY + shakeY * scale);
  ctx.scale(scale, scale);
  fn(ctx);
  ctx.restore();
}

// --- Named draw functions (required by spec) ---

function drawArena(c) {
  if (loadedAssets.arenaBackground) {
    c.drawImage(loadedAssets.arenaBackground, 0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
  } else {
    const g = c.createLinearGradient(0,0,0,DESIGN_HEIGHT);
    g.addColorStop(0, COL.bg1); g.addColorStop(1, COL.bg2);
    c.fillStyle = g;
    c.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
    c.strokeStyle = 'rgba(80,100,160,0.08)'; c.lineWidth = 1;
    for (let x = 0; x < DESIGN_WIDTH; x += 120) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,DESIGN_HEIGHT); c.stroke(); }
    for (let y = 0; y < DESIGN_HEIGHT; y += 120) { c.beginPath(); c.moveTo(0,y); c.lineTo(DESIGN_WIDTH,y); c.stroke(); }
  }
  for (const plat of PLATFORMS) {
    if (loadedAssets.platform) {
      c.drawImage(loadedAssets.platform, plat.x, plat.y, plat.width, plat.height);
    } else {
      c.fillStyle = COL.plat; c.fillRect(plat.x, plat.y, plat.width, plat.height);
      c.fillStyle = COL.platTop; c.fillRect(plat.x, plat.y, plat.width, 5);
    }
  }
}

function drawPlayer(c, player) {
  const { x, y, hitbox, color, hitFlash, ability, facing, isDummy, id } = player;
  const w = hitbox.width, h = hitbox.height;
  c.save();

  // Invulnerability pulsing alpha
  if (player.invulnTimer > 0) {
    c.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(player.invulnTimer * 9));
  }

  if (ability.active && ability.type === 'dash') {
    c.shadowBlur = 24; c.shadowColor = color;
  }

  const fc = hitFlash > 0 ? '#ffffff' : color;
  const assetKey = id === 1 ? 'player1Idle' : 'player2Idle';
  if (loadedAssets[assetKey]) {
    c.drawImage(loadedAssets[assetKey], x, y, w, h);
  } else {
    c.fillStyle = fc;
    c.fillRect(x, y, w, h);
    // Eye direction indicator
    c.fillStyle = '#001122';
    const ex = facing > 0 ? x + w*0.65 : x + w*0.1;
    c.fillRect(ex, y+14, 7, 7);
  }

  c.globalAlpha = 1;

  // Thin HP bar just above player body (below name label)
  const hbw = w + 16, hbh = 5;
  c.fillStyle = '#1a1a1a'; c.fillRect(x - 8, y - 10, hbw, hbh);
  c.fillStyle = player.health > 50 ? color : player.health > 25 ? '#ddaa00' : '#cc3333';
  c.fillRect(x - 8, y - 10, hbw * (player.health / player.maxHealth), hbh);

  if (isDummy) {
    c.fillStyle = '#999'; c.font = '16px monospace'; c.textAlign = 'center';
    c.fillText('DUMMY', x+w/2, y-20);
  }

  // Guard broken flash (red outline)
  if (player.guardBrokenTimer > 0) {
    c.save();
    c.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(player.guardBrokenTimer * 18));
    c.fillStyle = '#ff2200';
    c.fillRect(x - 6, y - 6, w + 12, h + 12);
    c.restore();
  }

  // Parry flash (white burst)
  if (player.parryFlash > 0) {
    c.save();
    c.globalAlpha = (player.parryFlash / 0.4) * 0.55;
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(x + w/2, y + h/2, Math.max(w,h) * 1.1, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  // Guard bubble (shield arc around player)
  if (player.guarding) {
    const isParry = isParryActive(player);
    c.save();
    c.globalAlpha = isParry ? 0.75 : 0.42;
    c.strokeStyle = isParry ? '#ffffff' : '#4488ff';
    c.lineWidth = isParry ? 4 : 2.5;
    c.shadowBlur = isParry ? 24 : 10;
    c.shadowColor = isParry ? '#aaddff' : '#2266cc';
    c.beginPath();
    c.arc(x + w/2, y + h/2, Math.max(w, h) * 0.78, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }

  // Status labels (top, stacked: y-85=guard/parry/broken, y-68=stun)
  if (player.guardBrokenTimer > 0) {
    c.fillStyle = '#ff3333'; c.font = 'bold 11px monospace'; c.textAlign = 'center';
    c.shadowBlur = 8; c.shadowColor = '#ff3333';
    c.fillText('BROKEN', x+w/2, y-85);
    c.shadowBlur = 0;
  } else if (isParryActive(player)) {
    c.fillStyle = '#ffffff'; c.font = 'bold 12px monospace'; c.textAlign = 'center';
    c.shadowBlur = 12; c.shadowColor = '#88ccff';
    c.fillText('PARRY!', x+w/2, y-85);
    c.shadowBlur = 0;
  } else if (player.guarding) {
    c.fillStyle = '#4488ff'; c.font = 'bold 11px monospace'; c.textAlign = 'center';
    c.shadowBlur = 6; c.shadowColor = '#4488ff';
    c.fillText('GUARD', x+w/2, y-85);
    c.shadowBlur = 0;
  }

  if (player.hitStunTimer > 0) {
    c.fillStyle = '#ff4444'; c.font = 'bold 11px monospace'; c.textAlign = 'center';
    c.shadowBlur = 6; c.shadowColor = '#ff4444';
    c.fillText('STUN', x+w/2, y-68);
    c.shadowBlur = 0;
  }

  // Shot enhancement badge (top slot)
  if (player.shotEnhanceActive) {
    const sLabel = { heavy:'HEAVY', twin:'TWIN', spread:'SPREAD' };
    c.fillStyle = '#ffee44'; c.font = 'bold 10px monospace'; c.textAlign = 'center';
    c.shadowBlur = 5; c.shadowColor = '#ffee44';
    c.fillText(sLabel[player.activeShotMode] || 'ENH', x+w/2, y-52);
    c.shadowBlur = 0;
  }

  // Power-up badge (below enhancement badge) — shows icon + remaining seconds
  if (player.powerUp) {
    const puCol = PU_COL[player.powerUp.type] || '#fff';
    c.fillStyle = puCol; c.font = 'bold 11px monospace'; c.textAlign = 'center';
    c.shadowBlur = 6; c.shadowColor = puCol;
    c.fillText(`${PU_ICON[player.powerUp.type] || '?'} ${Math.ceil(player.powerUp.timer)}s`, x+w/2, y-38);
    c.shadowBlur = 0;
  }

  // Dash charge ring — appears when charge >= minimum
  if (player.dashCharging && player.dashChargeTime >= DASH_CHARGE_MIN) {
    const ratio = Math.min(player.dashChargeTime / DASH_CHARGE_MAX, 1);
    c.globalAlpha = 0.9; c.lineWidth = 3; c.strokeStyle = color;
    c.beginPath();
    c.arc(x+w/2, y-28, 14, -Math.PI/2, -Math.PI/2 + Math.PI*2*ratio);
    c.stroke();
    c.fillStyle = '#fff'; c.font = 'bold 12px monospace'; c.textAlign = 'center';
    c.fillText('DASH', x+w/2, y-46);
  }
  c.restore();
}

function drawProjectile(c, proj) {
  c.save();
  const ownerCol = proj.ownerId === 1 ? COL.p1 : COL.p2;
  const st = proj.shotType || 'normal';

  if (loadedAssets.projectile) {
    c.shadowBlur = 14; c.shadowColor = ownerCol;
    const r = proj.hitRadius;
    c.drawImage(loadedAssets.projectile, proj.x - r, proj.y - r, r*2, r*2);
  } else if (st === 'heavy') {
    // Large orb: outer shell + bright inner core, strong glow
    c.shadowBlur = 22; c.shadowColor = ownerCol;
    c.fillStyle = ownerCol + '55';
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.85, 0, Math.PI*2); c.fill();
    c.strokeStyle = ownerCol; c.lineWidth = 3;
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.85, 0, Math.PI*2); c.stroke();
    c.shadowBlur = 0;
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.32, 0, Math.PI*2); c.fill();
  } else if (st === 'twin') {
    // Smaller orb, medium glow
    c.shadowBlur = 10; c.shadowColor = ownerCol;
    c.fillStyle = ownerCol;
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.58, 0, Math.PI*2); c.fill();
  } else if (st === 'spread') {
    // Tiny orb, light glow
    c.shadowBlur = 7; c.shadowColor = ownerCol;
    c.fillStyle = ownerCol + 'cc';
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.5, 0, Math.PI*2); c.fill();
  } else {
    // Normal: standard orb
    c.shadowBlur = 14; c.shadowColor = ownerCol;
    c.fillStyle = ownerCol;
    c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius * 0.55, 0, Math.PI*2); c.fill();
  }
  c.restore();
}

function drawAbilityTrail(c, ability) {
  if (!ability || !ability.pathData) return;
  const pd = ability.pathData;
  const mode = ability.mode;
  c.save();
  c.globalAlpha = 0.45;

  if (mode === 'linear') {
    c.strokeStyle = COL.linear; c.lineWidth = 2;
    c.setLineDash([10, 8]);
    c.beginPath();
    pd.linearSegments.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke(); c.setLineDash([]);
  } else {
    c.strokeStyle = COL.spline; c.lineWidth = 2; c.setLineDash([]);
    c.beginPath();
    pd.curvePoints.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke();
    c.globalAlpha = 0.55;
    pd.curvePoints.forEach((p,i) => {
      if (i % 12 === 0) {
        c.beginPath(); c.arc(p.x, p.y, 3, 0, Math.PI*2);
        c.fillStyle = COL.sampled; c.fill();
      }
    });
  }

  pd.waypoints.forEach((wp,i) => {
    c.globalAlpha = 0.9;
    c.beginPath(); c.arc(wp.x, wp.y, 7, 0, Math.PI*2);
    c.fillStyle = COL.waypoint; c.fill();
    c.fillStyle = '#000'; c.font = '13px monospace'; c.textAlign = 'center';
    c.fillText('P'+i, wp.x, wp.y+5);
  });
  c.restore();
}

function drawHitboxDebug(c, entity) {
  c.save();
  c.strokeStyle = '#00ff00'; c.lineWidth = 2;
  c.strokeRect(entity.x, entity.y, entity.hitbox.width, entity.hitbox.height);
  if (entity.attackActive) {
    const aw = entity.hitbox.width;
    const ax = entity.x + (entity.facing>0 ? aw : -aw);
    c.strokeStyle = '#ffff00';
    c.strokeRect(ax, entity.y, aw, entity.hitbox.height);
  }
  c.restore();
}

function drawMethodOverlay(c) { renderOverlay(c); }

function drawDashPreview(c, pathData, mode) {
  if (!pathData) return;
  c.save();
  c.globalAlpha = 0.38;
  if (mode === 'linear') {
    c.strokeStyle = COL.linear; c.lineWidth = 2; c.setLineDash([8, 7]);
    c.beginPath();
    pathData.linearSegments.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke(); c.setLineDash([]);
  } else {
    c.strokeStyle = COL.spline; c.lineWidth = 2.5; c.setLineDash([]);
    c.beginPath();
    pathData.curvePoints.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke();
    c.globalAlpha = 0.5;
    pathData.curvePoints.forEach((p,i) => {
      if (i % 12 === 0) {
        c.beginPath(); c.arc(p.x,p.y,3,0,Math.PI*2);
        c.fillStyle = COL.sampled; c.fill();
      }
    });
  }
  pathData.waypoints.forEach(wp => {
    c.globalAlpha = 0.65;
    c.beginPath(); c.arc(wp.x,wp.y,5,0,Math.PI*2);
    c.fillStyle = COL.waypoint; c.fill();
  });
  c.restore();
}

function drawHitSparks(c) {
  c.save();
  for (const sp of GS.hitSparks) {
    const alpha = sp.life / sp.maxLife;
    c.globalAlpha = alpha;
    if (sp.parry) {
      c.fillStyle = '#aaddff';
      c.beginPath(); c.arc(sp.x, sp.y, 4.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(sp.x, sp.y, 2.2, 0, Math.PI * 2); c.fill();
    } else if (sp.block) {
      c.fillStyle = '#4488ff';
      c.beginPath(); c.arc(sp.x, sp.y, 3, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#aaccff';
      c.beginPath(); c.arc(sp.x, sp.y, 1.5, 0, Math.PI * 2); c.fill();
    } else if (sp.explRing) {
      const ringRatio = 1 - (sp.life / sp.maxLife);
      const ringR = Math.max(1, (sp.maxRadius || 120) * ringRatio);
      c.strokeStyle = '#ff8800';
      c.lineWidth = Math.max(0.5, 7 * (sp.life / sp.maxLife));
      c.beginPath(); c.arc(sp.x, sp.y, ringR, 0, Math.PI * 2); c.stroke();
      c.lineWidth = 1;
    } else if (sp.meteor) {
      c.fillStyle = '#ff8800';
      c.beginPath(); c.arc(sp.x, sp.y, 5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffcc44';
      c.beginPath(); c.arc(sp.x, sp.y, 2.5, 0, Math.PI * 2); c.fill();
    } else {
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(sp.x, sp.y, 3.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffcc44';
      c.beginPath(); c.arc(sp.x, sp.y, 2, 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
  c.restore();
}

function drawMeteors(c) {
  const now = Date.now();
  for (const m of GS.meteors) {
    if (!m.active) continue;
    if (m.phase === 'warning') {
      c.save();
      const pulse = 0.55 + 0.45 * Math.abs(Math.sin(now / 340));
      c.globalAlpha = 0.45 + 0.3 * pulse;
      c.strokeStyle = '#ffee44'; c.lineWidth = 3; c.setLineDash([14, 8]);
      c.beginPath();
      m.pathData.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
      c.stroke(); c.setLineDash([]);
      c.globalAlpha = 0.5;
      m.pathData.curvePoints.forEach((p,i) => { if(i%10===0){ c.beginPath(); c.arc(p.x,p.y,4,0,Math.PI*2); c.fillStyle='#ffcc00'; c.fill(); } });
      m.pathData.waypoints.forEach((wp,i) => {
        c.globalAlpha = 0.85;
        c.beginPath(); c.arc(wp.x,wp.y,8,0,Math.PI*2); c.fillStyle='#ffee44'; c.fill();
        c.fillStyle='#000'; c.font='12px monospace'; c.textAlign='center'; c.fillText('P'+i, wp.x, wp.y+4);
      });
      c.restore();
    } else {
      // Faint path trail
      c.save(); c.globalAlpha = 0.22;
      c.strokeStyle = '#ffcc00'; c.lineWidth = 2.5;
      c.beginPath();
      m.pathData.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
      c.stroke(); c.restore();
      // Meteor body
      c.save();
      c.shadowBlur = 30; c.shadowColor = m.color;
      c.fillStyle = m.color;
      c.beginPath(); c.arc(m.x, m.y, m.radius, 0, Math.PI*2); c.fill();
      c.shadowBlur = 0;
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(m.x, m.y, m.radius * 0.36, 0, Math.PI*2); c.fill();
      c.restore();
    }
  }
}

function drawArenaEventBanner(c) {
  const now = Date.now();
  const activeMeteor = GS.meteors.find(m => m.active);
  if (activeMeteor && activeMeteor.phase === 'warning') {
    const pulse = 0.65 + 0.35 * Math.abs(Math.sin(now / 290));
    c.save();
    c.textAlign = 'center'; c.font = 'bold 28px monospace';
    c.globalAlpha = pulse;
    c.shadowBlur = 20; c.shadowColor = '#ffee44';
    c.fillStyle = '#ffee66';
    c.fillText('⚠  METHOD STORM WARNING  ⚠', DESIGN_WIDTH/2, 132);
    c.shadowBlur = 0; c.globalAlpha = 1; c.restore();
  } else if (!activeMeteor && GS.meteorTimer < 5) {
    c.save();
    c.textAlign = 'center'; c.font = '22px monospace';
    c.fillStyle = '#887744';
    c.fillText(`Method Storm in ${GS.meteorTimer.toFixed(1)}s`, DESIGN_WIDTH/2, 132);
    c.restore();
  }
}

// projectile trail — owner color for line, academic colors for sampled points and waypoints
function drawProjTrail(c, proj) {
  if (!proj.pathData) return;
  const pd = proj.pathData;
  const mode = proj.mode;
  const ownerCol = proj.ownerId === 1 ? COL.p1 : COL.p2;
  c.save();
  c.globalAlpha = 0.35;

  if (mode === 'linear') {
    c.strokeStyle = ownerCol; c.lineWidth = 2; c.setLineDash([10, 8]);
    c.beginPath();
    pd.linearSegments.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke(); c.setLineDash([]);
  } else {
    c.strokeStyle = ownerCol; c.lineWidth = 2;
    c.beginPath();
    pd.curvePoints.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke();
    c.globalAlpha = 0.5;
    pd.curvePoints.forEach((p,i) => {
      if (i % 12 === 0) {
        c.beginPath(); c.arc(p.x,p.y,3,0,Math.PI*2);
        c.fillStyle = COL.sampled; c.fill();
      }
    });
  }

  pd.waypoints.forEach((wp,i) => {
    c.globalAlpha = 0.65;
    c.beginPath(); c.arc(wp.x,wp.y,6,0,Math.PI*2);
    c.fillStyle = COL.waypoint; c.fill();
    c.fillStyle = '#000'; c.font = '11px monospace'; c.textAlign = 'center';
    c.fillText('P'+i, wp.x, wp.y+4);
  });
  c.restore();
}

const SHOT_NAME = { heavy:'Heavy', twin:'Twin', spread:'Spread' };

function drawPlayerHUD(c, player, isLeft) {
  const hw = 420, hh = 158;
  const hx = isLeft ? 16 : DESIGN_WIDTH - hw - 16;
  const hy = DESIGN_HEIGHT - hh - 16;

  c.fillStyle = 'rgba(0,0,12,0.82)';
  c.strokeStyle = player.color + 'aa';
  c.lineWidth = 1.5;
  c.beginPath(); c.rect(hx, hy, hw, hh); c.fill(); c.stroke();

  const tx = hx + 12;
  let ty = hy + 20;

  // Row 1: name + stocks + HP value
  const name = player.isDummy ? 'DUMMY' : (player.isAI ? 'AI' : `P${player.id}`);
  const stocks = '♥'.repeat(player.stocks) + '♡'.repeat(Math.max(0, 3 - player.stocks));
  c.font = 'bold 15px monospace'; c.fillStyle = player.color; c.textAlign = 'left';
  c.fillText(`${name}  ${stocks}   HP ${player.health}/100`, tx, ty); ty += 13;

  // Row 2: HP bar
  const bw = hw - 24;
  c.fillStyle = '#1a1a1a'; c.fillRect(tx, ty, bw, 7);
  c.fillStyle = player.health > 50 ? '#44cc44' : player.health > 25 ? '#ddaa00' : '#cc2222';
  c.fillRect(tx, ty, bw * (player.health / player.maxHealth), 7); ty += 24;

  // Row 3: cooldowns
  const dashReady = player.cooldowns.dash <= 0;
  const projReady = player.cooldowns.projectile <= 0;
  c.font = '14px monospace';
  c.fillStyle = dashReady ? '#44ff88' : '#777777';
  c.fillText(dashReady ? 'Dash: READY' : `Dash: ${player.cooldowns.dash.toFixed(1)}s`, tx, ty);
  c.fillStyle = projReady ? '#44ff88' : '#777777';
  c.fillText(projReady ? 'Proj: READY' : `Proj: ${player.cooldowns.projectile.toFixed(1)}s`, tx + 210, ty); ty += 18;

  // Row 4: shot mode
  c.font = '14px monospace'; c.fillStyle = '#ccbbff';
  c.fillText(`Shot Mode: ${SHOT_NAME[player.shotMode] || player.shotMode}`, tx, ty); ty += 17;

  // Row 5: enhancement state
  let enhStr, enhCol;
  if (player.shotEnhanceActive) {
    enhStr = `Enhance: ACTIVE ${player.shotEnhanceTimer.toFixed(1)}s [${(SHOT_NAME[player.activeShotMode] || '').toUpperCase()}]`;
    enhCol = '#ffee44';
  } else if (player.shotEnhanceCooldown > 0) {
    enhStr = `Enhance: CD ${player.shotEnhanceCooldown.toFixed(1)}s`;
    enhCol = '#666666';
  } else {
    enhStr = `Enhance: READY`;
    enhCol = '#44ddff';
  }
  c.font = '14px monospace'; c.fillStyle = enhCol;
  c.fillText(enhStr, tx, ty); ty += 17;

  // Row 6: power-up (left) + shield status (right) — combined, no overlap
  const _puSh = { curveAmplifier:'Curve+', sampleDensityBoost:'N+', constantSpeedSurge:'SPD' };
  const puRowStr = player.powerUp ? `PU: ${_puSh[player.powerUp.type]||'?'} ${player.powerUp.timer.toFixed(1)}s` : 'PU: None';
  const puRowCol = player.powerUp ? (PU_COL[player.powerUp.type]||'#fff') : '#3a3a4a';
  const shPct = player.shield / player.maxShield;
  let shRowStr, shRowCol;
  if (player.guardBrokenTimer > 0)  { shRowStr=`SH:BRK ${player.guardBrokenTimer.toFixed(1)}s`; shRowCol='#cc2222'; }
  else if (isParryActive(player))   { shRowStr='SH:PARRY!';                                       shRowCol='#ffffff'; }
  else if (player.guarding)         { shRowStr=`SH:GUARD ${Math.round(player.shield)}%`;          shRowCol='#88aaff'; }
  else                              { shRowStr=`SH: ${Math.round(player.shield)}%`;               shRowCol=shPct>0.6?'#3366cc':shPct>0.3?'#aaaa22':'#cc4422'; }
  c.font = '13px monospace'; c.textAlign = 'left';
  c.fillStyle = puRowCol; c.fillText(puRowStr, tx, ty);
  c.fillStyle = shRowCol; c.fillText(shRowStr, tx + 210, ty);

  // Row 7: compact permanent stat mods (only if any are non-default)
  const sm = player.statMods;
  const _hasMod = Math.abs(sm.projectileSpeedMult-1)>0.005 || Math.abs(sm.projectileCooldownMult-1)>0.005 ||
                  Math.abs(sm.dashSpeedMult-1)>0.005 || Math.abs(sm.dashCooldownMult-1)>0.005 || Math.abs(sm.shieldRegenMult-1)>0.005;
  if (_hasMod) {
    ty += 15;
    const _sp = [];
    if (Math.abs(sm.projectileSpeedMult   -1)>0.005) _sp.push(`PS${sm.projectileSpeedMult.toFixed(2)}x`);
    if (Math.abs(sm.projectileCooldownMult-1)>0.005) _sp.push(`PC${sm.projectileCooldownMult.toFixed(2)}x`);
    if (Math.abs(sm.dashSpeedMult         -1)>0.005) _sp.push(`DS${sm.dashSpeedMult.toFixed(2)}x`);
    if (Math.abs(sm.dashCooldownMult      -1)>0.005) _sp.push(`DC${sm.dashCooldownMult.toFixed(2)}x`);
    if (Math.abs(sm.shieldRegenMult       -1)>0.005) _sp.push(`SR${sm.shieldRegenMult.toFixed(2)}x`);
    c.font = '12px monospace'; c.fillStyle = '#88ccaa'; c.textAlign = 'left';
    c.fillText('Stats: ' + _sp.slice(0, 3).join('  '), tx, ty);
  }
}

function drawFloatTexts(c) {
  c.save(); c.textAlign = 'center';
  for (const ft of GS.floatTexts) {
    const alpha = Math.min(1, (ft.life / ft.maxLife) * 1.5);
    c.globalAlpha = alpha;
    c.font = `bold ${ft.size || 18}px monospace`;
    c.shadowBlur = 10; c.shadowColor = ft.color;
    c.fillStyle = ft.color;
    c.fillText(ft.text, ft.x, ft.y);
    c.shadowBlur = 0;
  }
  c.globalAlpha = 1; c.restore();
}

// Reusable translucent glass panel
function drawGlassPanel(c, x, y, w, h, accentCol) {
  c.save();
  c.fillStyle = 'rgba(3,6,22,0.90)';
  c.strokeStyle = accentCol || '#1a2a4a';
  c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(x, y, w, h, 6); c.fill(); c.stroke();
  c.strokeStyle = (accentCol || '#003366') + '66';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x+10, y+1.5); c.lineTo(x+w-10, y+1.5); c.stroke();
  c.restore();
}

// Gameplay CRT overlay — scanlines + vignette + edge tint. Tune via GAMEPLAY_CRT constants.
function drawCRTOverlay(c) {
  if (!GAMEPLAY_CRT.enabled) return;
  const W = DESIGN_WIDTH, H = DESIGN_HEIGHT;
  c.save();
  c.globalAlpha = GAMEPLAY_CRT.scanlineAlpha;
  c.fillStyle = '#000';
  for (let sy = 0; sy < H; sy += 4) c.fillRect(0, sy, W, 2);
  c.globalAlpha = 1;
  const vg = c.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(0,0,14,${(GAMEPLAY_CRT.vignetteAlpha * 2.67).toFixed(2)})`);
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  if (GAMEPLAY_CRT.edgeTintAlpha > 0) {
    const et = c.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.88);
    et.addColorStop(0, 'rgba(0,0,0,0)');
    et.addColorStop(1, `rgba(0,20,60,${GAMEPLAY_CRT.edgeTintAlpha})`);
    c.fillStyle = et; c.fillRect(0, 0, W, H);
  }
  c.restore();
}

// Text progress bar: filled=█ empty=░
function makeTextBar(ratio, len) {
  len = len || 10;
  const n = Math.round(Math.max(0, Math.min(1, ratio)) * len);
  return '█'.repeat(n) + '░'.repeat(len - n);
}

// Base terminal panel background + border
function drawTerminalWindow(c, x, y, w, h, accentColor) {
  c.save();
  c.fillStyle = 'rgba(4,7,22,0.93)';
  c.strokeStyle = accentColor || '#1e3a5a';
  c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(x, y, w, h, 5); c.fill(); c.stroke();
  c.restore();
}

// Terminal title bar: traffic-light dots + title + separator + small ▲ mark
function drawTerminalHeader(c, x, y, w, title, accentColor) {
  const hh = 21;
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.30)';
  c.beginPath(); c.roundRect(x+1, y+1, w-2, hh-1, [4,4,0,0]); c.fill();
  c.strokeStyle = (accentColor||'#1e3a5a') + 'bb';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x+1, y+hh); c.lineTo(x+w-1, y+hh); c.stroke();
  const cy = y + hh/2 + 0.5;
  [['#ff5f57',x+12],['#ffbd2e',x+26],['#28c840',x+40]].forEach(([col,cx])=>{
    c.fillStyle = col; c.beginPath(); c.arc(cx, cy, 4.5, 0, Math.PI*2); c.fill();
  });
  c.fillStyle = (accentColor||'#4488bb') + '55';
  c.beginPath(); c.moveTo(x+56,cy+5); c.lineTo(x+61,cy-4); c.lineTo(x+66,cy+5); c.closePath(); c.fill();
  c.font = 'bold 11px monospace'; c.fillStyle = accentColor||'#5588bb';
  c.textAlign = 'left'; c.fillText(title, x+72, cy+4);
  c.restore();
}

// Top-left terminal: game/session status
function drawTopLeftTerminal(c) {
  const { x, y, w, h } = HUD_TOP_LEFT;
  const hh = 21;
  drawTerminalWindow(c, x, y, w, h, '#2255aa');

  function tRow(k, v, kC, vC) {
    c.font='bold 14px monospace'; c.fillStyle=kC; c.textAlign='left'; c.fillText(k, tx, ty);
    c.font='14px monospace'; c.fillStyle=vC; c.fillText(v, tx+88, ty); ty+=lh;
  }

  tRow('STORM:', `LV ${stLv}  meteors ${mActive}/${mCfg.maxActive}`,          stLv>=3?'#ff8833':'#446688', stLv>=3?'#ffaa55':'#88aacc');
  tRow('FIELD:', `${puCount} power-up${puCount!==1?'s':''} on field`,         '#4a3a66', '#cc88ff');
  c.font='11px monospace'; c.fillStyle='#1e3040'; c.textAlign='left';

}

function drawTopRightTerminal(c) {

  const mm = GS.methodMode, isCat = mm!=='linear', isFull = mm==='full';

// Per-player bottom terminal (replaces drawPlayerStatusStrip)
function drawPlayerTerminal(c, player, isLeft) {
  const { x, y, w, h } = isLeft ? HUD_P1 : HUD_P2;
  const hh = 21;
  const pName = player.isDummy?'dummy':(player.isAI?'ai':`p${player.id}`);
  drawTerminalWindow(c, x, y, w, h, player.color+'99');
  drawTerminalHeader(c, x, y, w, `[${pName}@methodlab ~]$ status`, player.color);
  // Compact layout (Patch K.1): 8-char bars, tighter spacing, slightly smaller fonts
  const tx = x+12, lh = 20, barX = tx+66, valX = tx+148;
  let ty = y + hh + 15;

  function tRow(label, bar, val, lC, bC) {
    c.font='bold 14px monospace'; c.fillStyle=lC; c.textAlign='left'; c.fillText(label, tx, ty);
    c.font='14px monospace'; c.fillStyle=bC; c.fillText(bar, barX, ty);
    c.font='13px monospace'; c.fillStyle=bC; c.fillText(val, valX, ty);
    ty += lh;
  }

  // LIVES
  c.font='bold 15px monospace'; c.fillStyle=player.color; c.textAlign='left';
  c.fillText(`LIVES: ${player.stocks}`, tx, ty); ty += lh;

  // HP
  const hpRatio = player.health/player.maxHealth;
  const hpCol = player.health>50?'#33dd66':player.health>25?'#ddcc22':'#dd3333';
  tRow('HP:',     makeTextBar(hpRatio, 8), `${player.health}`, '#8899aa', hpCol);

  // SHIELD
  const shFrac = player.shield/player.maxShield;
  let shCol = shFrac>0.5?'#4488cc':shFrac>0.3?'#ddaa22':'#dd3333';
  if (player.guardBrokenTimer>0)    shCol='#dd2222';
  else if (isParryActive(player))   shCol='#eef8ff';
  else if (player.guarding)         shCol='#66aaff';
  tRow('SHLD:',   makeTextBar(shFrac, 8), `${Math.round(player.shield)}%`, '#8899aa', shCol);

  // DASH
  const dReady = player.cooldowns.dash<=0;
  const dRatio  = dReady?1:Math.max(0,1-player.cooldowns.dash/CD_MAX.dash);
  tRow('DASH:',   makeTextBar(dRatio, 8),  dReady?'RDY':`${player.cooldowns.dash.toFixed(1)}s`,  '#8899aa', dReady?'#33dd66':'#ddaa22');

  // PROJ
  const pjReady = player.cooldowns.projectile<=0;
  const pjRatio  = pjReady?1:Math.max(0,1-player.cooldowns.projectile/CD_MAX.projectile);
  tRow('PROJ:',   makeTextBar(pjRatio, 8), pjReady?'RDY':`${player.cooldowns.projectile.toFixed(1)}s`, '#8899aa', pjReady?'#33dd66':'#ddaa22');

  // SHOT
  const shotFull = {heavy:'HEAVY',twin:'TWIN',spread:'SPREAD'}[player.shotMode]||'NORMAL';
  const enh = player.shotEnhanceActive;
  c.font='bold 14px monospace'; c.fillStyle='#8899aa'; c.textAlign='left'; c.fillText('SHOT:', tx, ty);
  c.font='14px monospace'; c.fillStyle=enh?'#ffee44':'#aabbcc';
  c.fillText(shotFull+(enh?'  ⚡ENH':''), barX, ty); ty+=lh;

  // STATE line
  const parts=[];
  if (player.powerUp) {
    const pn={curveAmplifier:'CURVE+',sampleDensityBoost:'N+',constantSpeedSurge:'SPD+'}[player.powerUp.type]||'PU';
    parts.push({t:`PU:${pn} ${player.powerUp.timer.toFixed(1)}s`, c:'#cc88ff'});
  }
  if (enh) parts.push({t:`ENH ${player.shotEnhanceTimer.toFixed(1)}s`, c:'#ffee44'});
  if (player.guardBrokenTimer>0) parts.push({t:'GUARD-BRK', c:'#ff3333'});
  else if (isParryActive(player))  parts.push({t:'PARRY!',   c:'#eef8ff'});
  else if (player.guarding)        parts.push({t:'GUARD',    c:'#4488ff'});
  if (player.hitStunTimer>0)       parts.push({t:'STUN',     c:'#ff6644'});
  if (parts.length) {
    c.font='bold 12px monospace'; c.textAlign='left'; let sx2=tx;
    parts.slice(0,3).forEach(p=>{ c.fillStyle=p.c; c.fillText(p.t, sx2, ty); sx2+=c.measureText(p.t).width+9; });
  }
}

// Top-level HUD — drawn after CRT overlay so terminals stay sharp
function drawFourTerminalHUD(c) {

// ── Legacy terminal console (kept for reference, no longer called) ────────────
function drawGameplayTerminal(c) {
  const TW = 418, startX = DESIGN_WIDTH - TW - 12, startY = 12;
  const now = Date.now();
  drawGlassPanel(c, startX, startY, TW, 574, '#1a3a6a');

  const mm = GS.methodMode, isCat = mm !== 'linear', isFull = mm === 'full';
  const [p1, p2] = GS.players;
  let tx = startX + 14, ty = startY + 19;

  function tln(text, col, bold) {
    c.font = `${bold?'bold ':''}14px monospace`;
    c.fillStyle = col || '#8899aa'; c.textAlign = 'left';
    c.fillText(text, tx, ty); ty += 20;
  }
  function tsep() {
    c.strokeStyle = '#0d1e30'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(tx-4, ty-3); c.lineTo(startX+TW-12, ty-3); c.stroke();
    ty += 7;
  }

  // Header — terminal prompt feel
  const blink = Math.floor(now/700)%2===0?'█':' ';
  const modeSlug = { versus:'versus', practice:'practice', vsai:'vs-ai', demoLab:'demo-lab' };
  c.font = 'bold 11px monospace'; c.fillStyle = '#1a3a5a'; c.textAlign = 'left';
  c.fillText('methodlab@crt-sim:~/live_match$', tx, ty); ty += 17;
  c.font = '11px monospace'; c.fillStyle = '#112233';
  c.fillText(`spline-fighter --mode ${modeSlug[GS.mode]||GS.mode} ${blink}`, tx, ty); ty += 21;
  tsep();

  // [SESSION]
  c.font = 'bold 11px monospace'; c.fillStyle = '#1e3e5a'; c.fillText('[SESSION]', tx, ty); ty += 17;
  const modeNames = { versus:'VS LOCAL', practice:'PRACTICE', vsai:'VS AI', demoLab:'DEMO LAB' };
  tln(`mode    ${modeNames[GS.mode]||GS.mode.toUpperCase()}`, '#7799bb');
  const mmName = { linear:'LINEAR  (no method)', catmull:'CATMULL-ROM only', full:'FULL NUMERICAL' };
  tln(`method  ${mmName[mm]}`, '#ffdd44');
  const abil = statsInfo.abilityLabel || '—';
  tln(`ability ${abil.length>30 ? abil.slice(0,28)+'…' : abil}`, '#00d5ee');
  tsep();

  // [METHODS]
  c.font = 'bold 11px monospace'; c.fillStyle = '#1e3e5a'; c.fillText('[METHODS]', tx, ty); ty += 17;
  tln(`M1 catmull-rom   ${isCat  ?'✓ on':'✗ off'}`, isCat  ?'#33ee77':'#cc4444');
  tln(`M2 arc-length    ${isFull ?'✓ '+statsInfo.arcLength.toFixed(0)+'px':'✗ off'}`, isFull?'#33ee77':'#cc4444');
  tln(`M3 reparam       ${isFull ?'✓ on':'✗ off'}`, isFull?'#33ee77':'#cc4444');
  ty += 2;
  tln(`sampled  ${statsInfo.sampledCount} pts`, '#556677');
  tln(`dist     ${statsInfo.distance.toFixed(0)} px`, '#556677');
  tln(`speed    ${statsInfo.actualSpeed>0?statsInfo.actualSpeed.toFixed(0):statsInfo.speed} px/s`, statsInfo.actualSpeed>0?'#99ffaa':'#556677');
  tsep();

  // [COMBAT]
  c.font = 'bold 11px monospace'; c.fillStyle = '#1e3e5a'; c.fillText('[COMBAT]', tx, ty); ty += 17;
  const mMin = Math.floor(GS.matchTime/60), mSec = Math.floor(GS.matchTime%60);
  tln(`time  ${mMin}:${mSec.toString().padStart(2,'0')}`, '#887799');
  for (const [pi,p] of [[1,p1],[2,p2]]) {
    const pc = pi===1?'#4499ff':'#ff8844';
    const stk = '♥'.repeat(p.stocks)+'♡'.repeat(Math.max(0,3-p.stocks));
    tln(`P${pi}  HP ${p.health.toString().padStart(3)} / 100   ${stk}`, pc);
    if (p.powerUp) {
      const pn={curveAmplifier:'CURVE+',sampleDensityBoost:'N+',constantSpeedSurge:'SPD+'}[p.powerUp.type]||'PU';
      tln(`     [${pn}] ${p.powerUp.timer.toFixed(1)}s`, '#cc44ff');
    }
    if (p.shotEnhanceActive) tln(`     ⚡ ENH ${(SHOT_NAME[p.activeShotMode]||'').toUpperCase()} ${p.shotEnhanceTimer.toFixed(1)}s`, '#ffee44');
  }
  tsep();

  // [STORM]
  c.font = 'bold 11px monospace'; c.fillStyle = '#1e3e5a'; c.fillText('[STORM]', tx, ty); ty += 17;
  const stLv = getStormLevel(), mCfg = getMeteorSpawnConfig();
  const mActive = GS.meteors.filter(m=>m.active).length;
  const hasWarn = GS.meteors.some(m=>m.active&&m.phase==='warning');
  tln(`level   ${stLv} / 4`, stLv>=3?'#ff8833':'#556677');
  tln(`active  ${mActive} / ${mCfg.maxActive}`, mActive>0?'#ffaa44':'#556677');
  if (hasWarn) tln('⚠ METEOR INCOMING', '#ffee33');
  else         tln(`next    ${GS.meteorTimer.toFixed(1)}s`, '#445566');

  // ESC hint at bottom
  ty = startY + 556;
  c.font = '11px monospace'; c.fillStyle = '#182838'; c.textAlign = 'center';
  c.fillText('ESC: menu    TAB: demo lab    R: reset', startX + TW/2, ty);
}

// ── Compact terminal-style player status strip ────────────────────────────────
function drawPlayerStatusStrip(c, player, isLeft) {
  const SW = 432, SH = 112;
  const sx = isLeft ? 10 : DESIGN_WIDTH - SW - 10;
  const sy = DESIGN_HEIGHT - SH - 10;
  drawGlassPanel(c, sx, sy, SW, SH, player.color + '99');

  const tx = sx + 12;
  let ty = sy + 18;

  // Name + stocks + HP value
  const name = player.isDummy?'DUMMY':(player.isAI?'AI':`P${player.id}`);
  const stk = '♥'.repeat(player.stocks)+'♡'.repeat(Math.max(0,3-player.stocks));
  c.font = 'bold 15px monospace'; c.fillStyle = player.color; c.textAlign = 'left';
  c.fillText(name, tx, ty);
  c.font = '13px monospace'; c.fillStyle = player.color+'bb'; c.fillText(stk, tx+44, ty);
  const hpCol = player.health>50?'#55ff88':player.health>25?'#ffdd44':'#ff5555';
  c.textAlign = 'right'; c.fillStyle = hpCol; c.font = 'bold 14px monospace';
  c.fillText(`${player.health}hp`, sx+SW-12, ty); ty += 10;

  // HP bar
  const bw = SW-24;
  c.fillStyle = '#080e1c'; c.fillRect(tx, ty, bw, 7);
  c.fillStyle = player.health>50?'#2a8a44':player.health>25?'#8a8822':'#882222';
  c.fillRect(tx, ty, bw*(player.health/player.maxHealth), 7);
  c.strokeStyle = '#0d1a2e'; c.lineWidth = 1; c.strokeRect(tx, ty, bw, 7); ty += 11;

  // Shield bar
  const shFrac = player.shield/player.maxShield;
  const isParry = isParryActive(player);
  c.fillStyle = '#04080f'; c.fillRect(tx, ty, bw, 4);
  c.fillStyle = isParry?'#eef8ff':player.guarding?'#3366cc':player.guardBrokenTimer>0?'#440000':'#112244';
  c.fillRect(tx, ty, bw*shFrac, 4); ty += 11;

  // Row: cooldowns | shot mode | power-up
  c.font = '12px monospace'; c.textAlign = 'left';
  const dr = player.cooldowns.dash<=0, pr = player.cooldowns.projectile<=0;
  c.fillStyle = dr?'#22aa55':'#2a3a4a';
  c.fillText(dr?'DASH ●':`DASH ${player.cooldowns.dash.toFixed(1)}s`, tx, ty);
  c.fillStyle = pr?'#22aa55':'#2a3a4a';
  c.fillText(pr?'PROJ ●':`PROJ ${player.cooldowns.projectile.toFixed(1)}s`, tx+118, ty);
  const snC = player.shotEnhanceActive?'#ffee44':'#2a3a4a';
  const snL = {heavy:'HVY',twin:'TWN',spread:'SPR'}[player.activeShotMode||player.shotMode]||'NRM';
  c.fillStyle = snC; c.fillText((player.shotEnhanceActive?'⚡':' ')+snL, tx+246, ty);
  if (player.powerUp) {
    c.fillStyle = PU_COL[player.powerUp.type]||'#cc44ff';
    c.fillText(`${PU_ICON[player.powerUp.type]||'PU'} ${player.powerUp.timer.toFixed(1)}s`, tx+316, ty);
  }
  ty += 15;

  // Status flags
  const flags = [];
  if (player.guardBrokenTimer>0)  flags.push({t:'[BROKEN]',c:'#ff3333'});
  else if (isParry)               flags.push({t:'[PARRY!]',c:'#eef8ff'});
  else if (player.guarding)       flags.push({t:'[GUARD]', c:'#4488ff'});
  if (player.hitStunTimer>0)      flags.push({t:'[STUN]',  c:'#ff6644'});
  if (flags.length) {
    c.font = 'bold 11px monospace'; let fx = tx;
    flags.slice(0,3).forEach(f => {
      c.fillStyle = f.c; c.textAlign = 'left'; c.fillText(f.t, fx, ty);
      fx += c.measureText(f.t).width + 8;
    });
  }
  const sm = player.statMods;
  if (Math.abs(sm.dashSpeedMult-1)>0.005||Math.abs(sm.projectileSpeedMult-1)>0.005) {
    c.font = '10px monospace'; c.fillStyle = '#334455'; c.textAlign = 'right';
    c.fillText(`DS${sm.dashSpeedMult.toFixed(2)}x PS${sm.projectileSpeedMult.toFixed(2)}x`, sx+SW-12, ty);
  }
}

// ── TV Menu Overlay (Patch J.4 — screen fill fix + readable text + page flash) ─────

// Page flash triggered on menu open/close and page transitions (NOT nav up/down)
function triggerMenuPageFlash(strength) {
  strength = strength === undefined ? 1 : strength;
  UI.pageFlashTimer = 0;
  UI.pageFlashMax = 0.18 + strength * 0.10;
  UI.pageFlashStrength = strength;
}

function updateMenuEffects(dt) {
  if (UI.pageFlashTimer < UI.pageFlashMax) {
    UI.pageFlashTimer = Math.min(UI.pageFlashMax, UI.pageFlashTimer + dt);
  }
}

// Blue-white flicker + scanline burst drawn inside the CRT screen clip region
function drawMenuPageFlash(c, x, y, w, h) {
  if (UI.pageFlashMax <= 0 || UI.pageFlashTimer >= UI.pageFlashMax) return;
  const t = UI.pageFlashTimer / UI.pageFlashMax;
  const alpha = Math.sin(t * Math.PI) * UI.pageFlashStrength;
  if (alpha <= 0.002) return;
  c.save();
  c.fillStyle = `rgba(170,215,255,${(alpha * 0.55).toFixed(3)})`;
  c.fillRect(x, y, w, h);
  c.globalAlpha = alpha * 0.10;
  c.fillStyle = '#ffffff';
  for (let sy = y; sy < y + h; sy += 2) c.fillRect(x, sy, w, 1);
  c.restore();
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) {
  const c1 = 1.30158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function lerpVal(a, b, t) { return a + (b - a) * t; }

// Top-level composition. c is in virtual 1920×1080 space (inside withVirtual).
function drawMenuScene(c) {
  const rawT = UI.menuAnim;
  if (rawT <= 0) return;
  const t = easeOutCubic(rawT);

  // Layer 1 — dark base + optional room background (behind screen content)
  c.fillStyle = '#010308'; c.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
  drawZoomingCRTBackground(c, t);

  // Layer 2 — screen content (game/menu text) rendered behind the frame
  drawZoomingScreenContent(c, t, rawT);

  // Layer 3 — CRT frame cutout on top, transparent hole reveals screen content
  drawCRTFrameCutout(c, t);

  // Layer 4 — hand/remote rises from below as POV foreground
  drawRemoteOverlay(c, t, rawT);
}

// CRT bg draws at startScale zoomed toward TV center, animates to endScale (full room)
function drawZoomingCRTBackground(c, t) {
  const { startScale, endScale, anchorX, anchorY } = MENU_BG_ZOOM;
  const bgScale = lerpVal(startScale, endScale, t);
  const fadeAlpha = Math.min(1, t * 1.5); // fade completes before scale does
  const crtBg = loadedAssets['crtMenuBg'];
  if (crtBg) {
    c.save();
    c.globalAlpha = fadeAlpha;
    c.translate(anchorX, anchorY);
    c.scale(bgScale, bgScale);
    c.translate(-anchorX, -anchorY);
    c.drawImage(crtBg, 0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
    c.restore();
    c.globalAlpha = 1;
  } else {
    drawMenuFallback(c, t);
  }
}

// Fallback when crt_bg.png is missing
function drawMenuFallback(c, t) {
  const { x:ox, y:oy, w:ow, h:oh } = MENU_TV_SCREEN_FILL;
  c.save();
  c.globalAlpha = t * 0.88;
  c.fillStyle = '#020810'; c.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
  c.globalAlpha = t;
  c.strokeStyle = '#1e3050'; c.lineWidth = 5;
  c.beginPath(); c.roundRect(ox - 56, oy - 46, ow + 112, oh + 100, 14); c.stroke();
  c.restore();
  c.globalAlpha = 1;
}

// CRT frame cutout — room+bezel with transparent screen hole, drawn over screen content
function drawCRTFrameCutout(c, t) {
  const { startScale, endScale, anchorX, anchorY } = MENU_BG_ZOOM;
  const bgScale = lerpVal(startScale, endScale, t);
  const fadeAlpha = Math.min(1, t * 1.5);
  const frameImg = loadedAssets['crtFrameCutout'];
  if (!frameImg) return;
  c.save();
  c.globalAlpha = fadeAlpha;
  c.translate(anchorX, anchorY);
  c.scale(bgScale, bgScale);
  c.translate(-anchorX, -anchorY);
  c.drawImage(frameImg, 0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
  c.restore();
  c.globalAlpha = 1;
}

// Screen content shrinks into TV rect. Crossfades to menu text at rawT 0.75–1.0.
function drawZoomingScreenContent(c, t, rawT) {
  const { x:ox, y:oy, w:ow, h:oh } = MENU_TV_SCREEN_FILL;
  const rx = lerpVal(0, ox, t);
  const ry = lerpVal(0, oy, t);
  const rw = lerpVal(DESIGN_WIDTH,  ow, t);
  const rh = lerpVal(DESIGN_HEIGHT, oh, t);

  // Crossfade timing: rawT 0.75–1.0
  const gameFade = rawT < 0.75 ? 1.0 : Math.max(0, 1.0 - (rawT - 0.75) / 0.25);
  const menuFade = rawT < 0.75 ? 0.0 : Math.min(1.0, (rawT - 0.75) / 0.25);

  // Apply rounded clip (corner grows as rect shrinks toward TV screen shape)
  beginCRTScreenMask(c, rx, ry, rw, rh, t);

  // Dark screen base
  c.fillStyle = '#000408'; c.fillRect(rx, ry, rw, rh);

  // Game content — fades out
  if (gameFade > 0) {
    c.save();
    c.globalAlpha = gameFade;
    c.translate(rx, ry);
    c.scale(rw / DESIGN_WIDTH, rh / DESIGN_HEIGHT);
    if (GS.mode === 'demoLab') { renderDemoLab(c); } else { renderGame(c); }
    c.restore();
    c.globalAlpha = 1;
  }

  // Menu content — fades in (no heavy dark panel; screen is dark via base fill)
  if (menuFade > 0) {
    c.save();
    c.globalAlpha = menuFade;
    drawCRTScreenEffects(c, rx, ry, rw, rh);
    c.restore();
    c.globalAlpha = menuFade;
    if (UI.menuPage === 'controls') { drawControlsPageCRT(c); }
    else { drawMainMenuCRT(c); }
    c.globalAlpha = 1;
  }

  // Page transition flash — blue-white flicker on menu open/close/page change
  drawMenuPageFlash(c, rx, ry, rw, rh);

  // CRT glass overlay — vignette + subtle reflection, always on top inside mask
  drawCRTGlassOverlay(c, rx, ry, rw, rh, t);

  c.restore(); // end beginCRTScreenMask
}

// Clip context to a rounded-corner shape matching TV screen. Caller must c.restore().
function beginCRTScreenMask(c, rx, ry, rw, rh, t) {
  const cornerR = t * MENU_TV_SCREEN_MASK.r;
  c.save();
  c.beginPath();
  c.roundRect(rx, ry, rw, rh, cornerR);
  c.clip();
}

// Scanlines + top/bottom glow. Drawn inside the screen mask.
function drawCRTScreenEffects(c, rx, ry, rw, rh) {
  const fp = UI.flickerPulse;
  for (let sy = ry; sy < ry + rh; sy += 3) {
    c.fillStyle = 'rgba(0,0,0,0.10)'; c.fillRect(rx, sy, rw, 1);
  }
  const grd = c.createLinearGradient(rx, ry, rx, ry + rh);
  grd.addColorStop(0,   `rgba(0,50,160,${0.06 + 0.03 * fp})`);
  grd.addColorStop(0.5, 'rgba(0,0,0,0)');
  grd.addColorStop(1,   `rgba(0,30,100,${0.04 + 0.02 * fp})`);
  c.fillStyle = grd; c.fillRect(rx, ry, rw, rh);
  if (UI.selectFlash > 0) {
    const fa = Math.sin((UI.selectFlash / 0.18) * Math.PI) * 0.22;
    c.fillStyle = `rgba(0,100,255,${fa})`; c.fillRect(rx, ry, rw, rh);
  }
}

// Radial vignette + glass highlight. Drawn inside the screen mask on top of game/menu.
function drawCRTGlassOverlay(c, rx, ry, rw, rh, t) {
  // Edge vignette
  const vGrd = c.createRadialGradient(
    rx + rw * 0.5, ry + rh * 0.5, rh * 0.15,
    rx + rw * 0.5, ry + rh * 0.5, rh * 0.86
  );
  vGrd.addColorStop(0, 'rgba(0,0,0,0)');
  vGrd.addColorStop(1, `rgba(0,0,14,${0.58 * t})`);
  c.fillStyle = vGrd; c.fillRect(rx, ry, rw, rh);

  // Subtle glass reflection (top-left to center)
  const rGrd = c.createLinearGradient(rx, ry, rx + rw * 0.55, ry + rh * 0.45);
  rGrd.addColorStop(0,    `rgba(140,170,255,${0.07 * t})`);
  rGrd.addColorStop(0.35, `rgba(80,110,220,${0.03 * t})`);
  rGrd.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = rGrd; c.fillRect(rx, ry, rw, rh);

  // Inner border glow
  const cornerR = t * MENU_TV_SCREEN_MASK.r;
  c.save();
  c.strokeStyle = `rgba(50,70,190,${0.18 * t})`; c.lineWidth = 4;
  c.beginPath(); c.roundRect(rx + 2, ry + 2, rw - 4, rh - 4, Math.max(0, cornerR - 2));
  c.stroke();
  c.restore();
}

// Controls — four-block Arch-Linux-terminal layout spanning full CRT screen
function drawControlsPageCRT(c) {
  const { x:fx, y:fy, w:fw, h:fh } = MENU_TV_SCREEN_FILL;
  const pad = 34;
  const col1 = fx + pad;
  const col2 = fx + Math.floor(fw / 2) + 10;
  const rowH = 19;
  const fp = UI.flickerPulse;

  // Title
  c.save();
  c.font = 'bold 22px monospace';
  c.fillStyle = `rgba(0,${200 + Math.floor(55 * fp)},255,1)`;
  c.textAlign = 'left';
  c.shadowBlur = 14 + 6 * fp; c.shadowColor = '#005588';
  c.fillText('CONTROLS', col1, fy + 38);
  c.shadowBlur = 0;
  c.restore();

  c.strokeStyle = '#0e2238'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(col1, fy + 46); c.lineTo(fx + fw - pad, fy + 46); c.stroke();

  // Helper: section header
  function hdr(label, cx, cy, col) {
    c.save();

  const topBlock = fy + 66;

  // ── [P1] block ──
  hdr('[P1]', col1, topBlock, '#4499ff');

  const p1Rows = [
    ['A / D', 'move'],
    ['W', 'jump'],
    ['F', 'attack'],
    ['G', 'dash'],
    ['H', 'projectile'],
    ['C', 'shot mode'],
    ['V', 'enhance'],
    ['S', 'guard / parry'],

  p1Rows.forEach(([k, a]) => { row(k, a, col1, r1, '#5599cc', '#7ab8dd'); r1 += rowH; });

  // ── [P2] block ──
  hdr('[P2]', col2, topBlock, '#ff8844');
  let r2 = topBlock + rowH;

    ['← / →', 'move'],
    ['↑', 'jump'],
    ['K', 'attack'],
    ['L', 'dash'],
    [';', 'projectile'],
    ['N', 'shot mode'],
    ['M', 'enhance'],
    ['↓', 'guard / parry'],
  ];
  p2Rows.forEach(([k, a]) => { row(k, a, col2, r2, '#cc7744', '#dda070'); r2 += rowH; });

  const botBlock = topBlock + rowH * 9 + 10;

  // ── [GLOBAL] block ──
  hdr('[GLOBAL]', col1, botBlock, '#9999cc');
  let g1 = botBlock + rowH;
  const globalRows = [
    ['Esc', 'menu / back'],
    ['Tab', 'Demo Lab'],
    ['1/2/3', 'method mode'],
    ['R', 'reset match'],
    ['P', 'practice'],
    ['I', 'VS AI'],
  ];
  globalRows.forEach(([k, a]) => { row(k, a, col1, g1, '#8888bb', '#aaaacc'); g1 += rowH; });

  // ── [DEMO LAB] block ──
  hdr('[DEMO LAB]', col2, botBlock, '#33cc88');
  let g2 = botBlock + rowH;
  const demoRows = [
    ['G / H', 'dash / projectile'],
    ['M', 'meteor'],
    ['U', 'power-ups'],
    ['B', 'impact lab'],
    ['Q / E', 'module'],
    ['← / →', 'slider'],
    ['Space', 'restart'],
  ];
  demoRows.forEach(([k, a]) => { row(k, a, col2, g2, '#33aa77', '#55cc99'); g2 += rowH; });

  c.font = '11px monospace'; c.fillStyle = '#2e5070'; c.textAlign = 'left';
  c.fillText('ESC  back to menu', col1, fy + fh - 14);
}

// Remote — large POV foreground, rises from below with easeOutBack settle
function drawRemoteOverlay(c, t, rawT) {
  const { x, y, w, h } = REMOTE_DRAW;
  const { enterOffsetY, navBouncePx, okScale } = REMOTE_ANIM;

  // Use easeOutBack for a physical settle on entry
  const ebt = Math.min(1, easeOutBack(Math.min(1, rawT * 1.1)));
  const slideY = lerpVal(enterOffsetY, 0, ebt);

  // Nav/confirm bounce
  let bOffY = 0, scX = 1, scY = 1;
  const bSin = Math.sin(Math.min(UI.remoteBounce, 1) * Math.PI);
  if (UI.remoteState === 'up')   bOffY = -navBouncePx * bSin;
  if (UI.remoteState === 'down') bOffY =  navBouncePx * bSin;
  if (UI.remoteState === 'ok')   { scX = 1 + (okScale - 1) * bSin; scY = scX; }

  const imgKey = { idle:'remoteIdle', up:'remoteUp', down:'remoteDown', ok:'remoteOk' }[UI.remoteState] || 'remoteIdle';
  let img = loadedAssets[imgKey];
  if (!img) img = loadedAssets['remoteIdle'];

  const drawY = y + slideY + bOffY;
  const cx2 = x + w / 2, cy2 = drawY + h / 2;

  c.save();
  c.globalAlpha = Math.min(1, t * 1.3);
  if (img) {
    c.translate(cx2, cy2);
    c.scale(scX, scY);
    c.drawImage(img, -w / 2, -h / 2, w, h);
  } else {
    c.fillStyle = 'rgba(8,16,30,0.88)'; c.strokeStyle = '#1e3050'; c.lineWidth = 2;
    c.beginPath(); c.roundRect(x, drawY, w, h, 16); c.fill(); c.stroke();
    c.font = 'bold 16px monospace'; c.fillStyle = '#2a4a6a'; c.textAlign = 'center';
    c.fillText('[REMOTE]', cx2, drawY + h / 2);
  }
  c.restore();
  c.globalAlpha = 1;
}

// (old Demo Lab floating explanation dock removed in Patch L — replaced by the
//  bottom pipeline terminal in renderDemoLab / drawDemoBottomTerminal)

function renderGame(c) {
  const [p1,p2] = GS.players;

  // ── In-world camera framing (Patch K.2): shift gameplay view up by
  //    ARENA_VIEW_OFFSET_Y. Render-only; physics/collisions/input unchanged.
  //    Everything physically inside the arena moves together. ──────────────
  c.save();
  c.translate(0, ARENA_VIEW_OFFSET_Y);

  drawArena(c);

  if (p1.ability.active) drawAbilityTrail(c, p1.ability);
  else if (p1.dashCharging && p1.dashPreviewPath) drawDashPreview(c, p1.dashPreviewPath, GS.methodMode);
  if (p2.ability.active) drawAbilityTrail(c, p2.ability);
  else if (p2.dashCharging && p2.dashPreviewPath) drawDashPreview(c, p2.dashPreviewPath, GS.methodMode);
  for (const proj of GS.projectiles) drawProjTrail(c, proj);

  // Power-ups
  for (const pu of GS.powerUps) drawPowerUp(c, pu);

  drawPlayer(c, p1);
  drawPlayer(c, p2);

  for (const proj of GS.projectiles) drawProjectile(c, proj);

  drawHitSparks(c);
  drawMeteors(c);
  drawArenaEventBanner(c);
  drawFloatTexts(c);

  if (GS.showHitbox) {
    drawHitboxDebug(c, p1);
    drawHitboxDebug(c, p2);
    for (const proj of GS.projectiles) {
      c.save(); c.strokeStyle='#ff44ff'; c.lineWidth=2;
      c.beginPath(); c.arc(proj.x, proj.y, proj.hitRadius, 0, Math.PI*2); c.stroke();
      c.restore();
    }
  }

  c.restore(); // end in-world camera framing — screen-space UI below stays fixed

  // Player terminals drawn by drawFourTerminalHUD after CRT overlay

  if (GS.winner) {
    c.fillStyle = 'rgba(0,0,0,0.75)';
    c.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
    const winColor = GS.winner === 1 ? COL.p1 : COL.p2;
    c.fillStyle = winColor; c.font = 'bold 90px monospace'; c.textAlign = 'center';
    c.fillText(`PLAYER ${GS.winner} WINS!`, DESIGN_WIDTH/2, DESIGN_HEIGHT/2 - 30);
    c.fillStyle = '#aaa'; c.font = '32px monospace';
    const [wp1, wp2] = GS.players;
    c.fillText(`P1 Stocks: ${wp1.stocks}   P2 Stocks: ${wp2.stocks}`, DESIGN_WIDTH/2, DESIGN_HEIGHT/2 + 40);
    c.fillStyle = '#888'; c.font = '30px monospace';
    c.fillText('Press R to reset', DESIGN_WIDTH/2, DESIGN_HEIGHT/2 + 100);
  }
}

// --- Power-Up Showcase helpers ---

// Left/right panel path origins for the 2-panel comparison layout
const SHOW_LX = 80, SHOW_LY = 610, SHOW_RX = 1080, SHOW_RY = 610, SHOW_PDIST = 780;

function buildShowcasePaths(module, slider) {
  if (module === 'curveAmplifier') {
    const offset = Math.round(lerp(80, 350, slider));
    return {
      rawPath:    makeDashPathDir(SHOW_LX, SHOW_LY, 1, SHOW_PDIST, offset, STEPS_PER_SEG),
      methodPath: makeDashPathDir(SHOW_RX, SHOW_RY, 1, SHOW_PDIST, offset, STEPS_PER_SEG),
    };
  } else if (module === 'sampleDensityBoost') {
    const stepsHigh = Math.round(lerp(10, 120, slider));
    return {
      rawPath:    makeDashPathDir(SHOW_LX, SHOW_LY, 1, SHOW_PDIST, 200, 10),
      methodPath: makeDashPathDir(SHOW_RX, SHOW_RY, 1, SHOW_PDIST, 200, stepsHigh),
    };
  } else {
    return {
      rawPath:    makeDashPathDir(SHOW_LX, SHOW_LY, 1, SHOW_PDIST, 200, STEPS_PER_SEG),
      methodPath: makeDashPathDir(SHOW_RX, SHOW_RY, 1, SHOW_PDIST, 200, STEPS_PER_SEG),
    };
  }
}

function getShowcasePaths() {
  const sh = DS.puShowcase;
  if (!sh.cachedMethodPath || sh.cachedModule !== sh.module || sh.cachedSlider !== sh.slider) {
    const p = buildShowcasePaths(sh.module, sh.slider);
    sh.cachedRawPath    = p.rawPath;
    sh.cachedMethodPath = p.methodPath;
    sh.cachedModule = sh.module;
    sh.cachedSlider = sh.slider;
  }
  return { rawPath: sh.cachedRawPath, methodPath: sh.cachedMethodPath };
}

function updatePowerUpShowcase(dt) {
  if (!DS.puShowcase) return;
  const sh = DS.puShowcase;
  const { rawPath, methodPath } = getShowcasePaths();

  const speed = sh.module === 'constantSpeedSurge'
    ? Math.round(lerp(300, 1200, sh.slider))
    : SHOWCASE_BALL_SPEED;

  const prevRaw = sh.distRaw, prevMethod = sh.distMethod;
  sh.distRaw    += speed * dt;
  sh.distMethod += speed * dt;

  const rawLen = sh.module === 'curveAmplifier'
    ? linearSegLen(rawPath.linearSegments)
    : rawPath.totalLength;
  if (sh.distRaw    > rawLen)                 sh.distRaw    = 0;
  if (sh.distMethod > methodPath.totalLength)  sh.distMethod = 0;

  // Measure actual speeds (used in Constant-Speed Surge to show fluctuation vs stability)
  if (sh.module === 'constantSpeedSurge') {
    const N = rawPath.curvePoints.length;
    const rawFrac  = Math.min(sh.distRaw / rawPath.totalLength, 0.9999);
    const prevFrac = Math.min(prevRaw    / rawPath.totalLength, 0.9999);
    const ri  = Math.min(Math.floor(rawFrac  * N), N - 1);
    const pri = Math.min(Math.floor(prevFrac * N), N - 1);
    const rp = rawPath.curvePoints[ri], rpp = rawPath.curvePoints[pri];
    const rdx = rp.x - rpp.x, rdy = rp.y - rpp.y;
    sh.actualSpeedRaw = dt > 0 ? Math.sqrt(rdx*rdx + rdy*rdy) / dt : 0;

    const mc  = getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, sh.distMethod);
    const mcp = getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, Math.min(prevMethod, methodPath.totalLength - 0.01));
    const mdx = mc.x - mcp.x, mdy = mc.y - mcp.y;
    sh.actualSpeedMethod = dt > 0 ? Math.sqrt(mdx*mdx + mdy*mdy) / dt : speed;
  }
}

function drawSlider(c, x, y, w, label, valueText, sliderVal) {
  const labelW = 300;
  const trackX = x + labelW;
  const trackW = w - labelW - 180;
  const trackY = y - 10;
  const trackH = 18;

  c.font = 'bold 22px monospace';
  c.fillStyle = '#bbccdd';
  c.textAlign = 'left';
  c.fillText(label + ':', x, y + 5);

  // Track background
  c.fillStyle = '#0d1525';
  c.beginPath(); c.roundRect(trackX, trackY, trackW, trackH, 5); c.fill();

  // Track fill
  c.fillStyle = '#2255aa';
  if (sliderVal > 0) {
    c.beginPath(); c.roundRect(trackX, trackY, trackW * sliderVal, trackH, 5); c.fill();
  }

  // Thumb
  const thumbX = trackX + trackW * sliderVal;
  c.save();
  c.shadowBlur = 10; c.shadowColor = '#aaccff';
  c.fillStyle = '#ddeeff';
  c.beginPath(); c.arc(thumbX, trackY + trackH / 2, 13, 0, Math.PI * 2); c.fill();
  c.restore();

  // Min/max hint
  c.font = '14px monospace'; c.fillStyle = '#334455';
  c.textAlign = 'left';  c.fillText('min', trackX, trackY + trackH + 18);
  c.textAlign = 'right'; c.fillText('max', trackX + trackW, trackY + trackH + 18);

  // Value
  c.font = 'bold 26px monospace';
  c.fillStyle = '#ffdd44';
  c.textAlign = 'left';
  c.fillText(valueText, trackX + trackW + 22, y + 7);
}

function _drawShowcaseBall(c, pos, color) {
  c.save();
  c.shadowBlur = 20; c.shadowColor = color;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(pos.x, pos.y, 13, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;
  c.fillStyle = color;
  c.beginPath(); c.arc(pos.x, pos.y, 8, 0, Math.PI * 2); c.fill();
  c.restore();
}

// Power-Up Showcase — visuals only (paths, sampled points, balls), drawn in
// source coords. The three-terminal layout clips/transforms each half into a pane.
function drawShowcaseVisualsAll(c) {
  if (!DS.puShowcase) return;
  const sh = DS.puShowcase;
  const rawPath    = sh.cachedRawPath;
  const methodPath = sh.cachedMethodPath;
  if (!rawPath || !methodPath) return;

  const curveOffset = Math.round(lerp(80, 350, sh.slider));
  const stepsHigh   = Math.round(lerp(10, 120, sh.slider));
  const RAW_COL = '#ff7733';
  const MET_COL = '#00ffcc';

  // ===== MODULE-SPECIFIC RENDERING =====
  if (sh.module === 'curveAmplifier') {
    // LEFT: angular polyline
    const segs = rawPath.linearSegments;
    c.save(); c.globalAlpha = 0.9; c.strokeStyle = RAW_COL; c.lineWidth = 3;
    c.beginPath(); segs.forEach((p, i) => i === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y)); c.stroke();
    c.restore();
    segs.forEach((wp, i) => {
      c.fillStyle = COL.waypoint; c.beginPath(); c.arc(wp.x, wp.y, 8, 0, Math.PI*2); c.fill();
      c.fillStyle = '#000'; c.font = 'bold 12px monospace'; c.textAlign = 'center';
      c.fillText('P'+i, wp.x, wp.y+5);
    });

    // RIGHT: Catmull-Rom + sampled points
    c.save(); c.globalAlpha = 0.9; c.strokeStyle = MET_COL; c.lineWidth = 3;
    c.beginPath(); methodPath.curvePoints.forEach((p, i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y)); c.stroke(); c.restore();
    c.save(); c.globalAlpha = 0.6;
    methodPath.curvePoints.forEach((p, i) => { if (i%8===0) { c.beginPath(); c.arc(p.x,p.y,3,0,Math.PI*2); c.fillStyle=COL.sampled; c.fill(); } });
    c.restore();
    methodPath.waypoints.forEach((wp, i) => {
      c.fillStyle = COL.waypoint; c.beginPath(); c.arc(wp.x,wp.y,8,0,Math.PI*2); c.fill();
      c.fillStyle = '#000'; c.font = 'bold 12px monospace'; c.textAlign = 'center'; c.fillText('P'+i, wp.x, wp.y+5);
    });
    const p2m = methodPath.waypoints[2];
    c.font = '14px monospace'; c.fillStyle = MET_COL; c.textAlign = 'center';
    c.fillText('P2  offset=' + curveOffset + 'px', p2m.x, p2m.y - 16);

    // BALLS
    const rawTotal = linearSegLen(segs);
    _drawShowcaseBall(c, linearPosAtDist(segs, Math.min(sh.distRaw, rawTotal)), RAW_COL);
    _drawShowcaseBall(c, getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, Math.min(sh.distMethod, methodPath.totalLength)), MET_COL);

  } else if (sh.module === 'sampleDensityBoost') {
    // LEFT: low-sample curve + all dots (sparse)
    c.save(); c.globalAlpha = 0.55; c.strokeStyle = RAW_COL; c.lineWidth = 2.5;
    c.beginPath(); rawPath.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y)); c.stroke(); c.restore();
    rawPath.curvePoints.forEach((p) => { c.beginPath(); c.arc(p.x,p.y,5,0,Math.PI*2); c.fillStyle='#cc5511'; c.fill(); });

    // RIGHT: high-sample curve + dense dots
    c.save(); c.globalAlpha = 0.55; c.strokeStyle = MET_COL; c.lineWidth = 2.5;
    c.beginPath(); methodPath.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y)); c.stroke(); c.restore();
    const dotR = Math.max(1.5, 5.5 - stepsHigh / 25);
    methodPath.curvePoints.forEach((p) => { c.beginPath(); c.arc(p.x,p.y,dotR,0,Math.PI*2); c.fillStyle=COL.sampled; c.fill(); });

    // BALLS
    _drawShowcaseBall(c, getPositionAtDistance(rawPath.curvePoints, rawPath.arcLengths, Math.min(sh.distRaw, rawPath.totalLength)), RAW_COL);
    _drawShowcaseBall(c, getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, Math.min(sh.distMethod, methodPath.totalLength)), MET_COL);

  } else { // constantSpeedSurge
    // LEFT: Catmull-Rom curve + uniform sample index ticks (shows uneven spacing)
    c.save(); c.globalAlpha = 0.7; c.strokeStyle = RAW_COL; c.lineWidth = 2.5;
    c.beginPath(); rawPath.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y)); c.stroke(); c.restore();
    rawPath.curvePoints.forEach((p, i) => { if (i%8===0) { c.beginPath(); c.arc(p.x,p.y,4,0,Math.PI*2); c.fillStyle='#cc6622'; c.fill(); } });

    // RIGHT: same curve + equal arc-length ticks (shows even spacing)
    c.save(); c.globalAlpha = 0.7; c.strokeStyle = MET_COL; c.lineWidth = 2.5;
    c.beginPath(); methodPath.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y)); c.stroke(); c.restore();
    for (let d = 55; d < methodPath.totalLength; d += 55) {
      const tp = getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, d);
      c.beginPath(); c.arc(tp.x, tp.y, 4, 0, Math.PI*2); c.fillStyle = '#008877'; c.fill();
    }

    // BALLS — raw uses uniform parameter index; method uses getPositionAtDistance
    const N3 = rawPath.curvePoints.length;
    const rawFrac3 = Math.min(sh.distRaw / rawPath.totalLength, 0.9999);
    const rawIdx3  = Math.min(Math.floor(rawFrac3 * N3), N3 - 1);
    _drawShowcaseBall(c, rawPath.curvePoints[rawIdx3], RAW_COL);
    _drawShowcaseBall(c, getPositionAtDistance(methodPath.curvePoints, methodPath.arcLengths, Math.min(sh.distMethod, methodPath.totalLength)), MET_COL);
  }

}

// Power-Up Showcase live-value lines for the terminal stat blocks (raw vs method).
function showcaseStatLines(isRight) {

      : [{t:'CURVE: OFF', c:'#ff7777'}, {t:'PATH: angular polyline', c:'#ff9933'}, {t:'LEN: '+linearSegLen(rawPath.linearSegments).toFixed(0)+' px', c:'#ccbbaa'}, {t:'SAMPLES: '+rawPath.curvePoints.length+' pts', c:'#ccbbaa'}];
  } else if (sh.module === 'sampleDensityBoost') {

      : [{t:'STEPS/SEG: 10 (low)', c:'#ff7777'}, {t:'SAMPLES: '+rawPath.curvePoints.length+' pts', c:'#ff9933'}, {t:'ARC LEN: '+rawPath.totalLength.toFixed(0)+' px', c:'#ccbbaa'}, {t:'Riemann: coarse', c:'#ccbbaa'}];
  } else {

      ? [{t:'REPARAM: ON', c:'#77ff99'}, {t:'POS: getPositionAtDistance(d)', c:'#77ff99'}, {t:'SPEED: '+(sh.actualSpeedMethod>0?sh.actualSpeedMethod.toFixed(0)+' px/s ✓':'—'), c:'#aabbff'}, {t:'Motion: constant speed', c:'#00ffee'}]
      : [{t:'REPARAM: OFF', c:'#ff7777'}, {t:'POS: curvePoints[index]', c:'#ff9933'}, {t:'SPEED: '+(sh.actualSpeedRaw>0?sh.actualSpeedRaw.toFixed(0)+' px/s ⚡':'—'), c:'#ccbbaa'}, {t:'Motion: uneven', c:'#ccbbaa'}];

}

// Pipeline strip: Waypoints → Catmull-Rom → Arc Length → Reparameterization
// mode: 'linear' | 'catmull' | 'full'
function drawPipelineStrip(c, panX, panY, panW, mode) {
  const stages = [
    { name:'Waypoints',   ok: true },
    { name:'Catmull-Rom', ok: mode !== 'linear' },
    { name:'Arc Length',  ok: mode === 'full' },
    { name:'Reparam',     ok: mode === 'full' },
  ];
  c.save();
  c.fillStyle = 'rgba(0,0,14,0.75)';
  c.fillRect(panX + 4, panY - 20, panW - 8, 28);
  c.font = 'bold 13px monospace';
  const slotW = (panW - 8) / stages.length;
  stages.forEach((s, i) => {
    const ix = panX + 4 + i * slotW + 6;
    c.fillStyle = s.ok ? '#55ee77' : '#ff5555';
    c.textAlign = 'left';
    c.fillText(s.name + (s.ok ? ' ✓' : ' ✗'), ix, panY);
    if (i < stages.length - 1) {
      c.fillStyle = '#556677';
      c.fillText('→', panX + 4 + (i + 0.82) * slotW, panY);
    }
  });
  c.restore();
}

// Impact Ability Lab — visuals only (paths, shards, bounces, balls, burst rings),
// drawn in source coords. The three-terminal layout clips/transforms each half.
function drawImpactVisualsAll(c) {
  if (!DS.impactShowcase) return;
  const sh = DS.impactShowcase;
  const RAW_COL = '#ff7733', MET_COL = '#00ffcc';

  // Floor platforms
  c.fillStyle = COL.plat;
  c.fillRect(50, 870, DEMO_HW-100, 30); c.fillRect(DEMO_HW+50, 870, DEMO_HW-100, 30);
  c.fillStyle = COL.platTop;
  c.fillRect(50, 870, DEMO_HW-100, 5);  c.fillRect(DEMO_HW+50, 870, DEMO_HW-100, 5);

  // ===== LEFT PANEL: raw / no-method =====

  // Primary path: dashed straight line
  c.save(); c.globalAlpha = 0.50; c.strokeStyle = RAW_COL; c.lineWidth = 3; c.setLineDash([14,8]);
  c.beginPath();
  sh.leftPath.linearSegments.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
  c.stroke(); c.setLineDash([]); c.restore();

  // Waypoints P0-P3 with labels (raw side uses same waypoints as the path, showing "no curve")
  sh.leftPath.waypoints.forEach((wp,i) => {
    c.beginPath(); c.arc(wp.x,wp.y,7,0,Math.PI*2); c.fillStyle=COL.waypoint; c.fill();
    c.fillStyle='#000'; c.font='bold 11px monospace'; c.textAlign='center'; c.fillText('P'+i,wp.x,wp.y+4);
  });
  // Function tag: no Catmull-Rom used
  const lmid = sh.leftPath.waypoints[1];
  c.font='bold 13px monospace'; c.fillStyle='#ff7755'; c.textAlign='center';
  c.fillText('(no buildCurve)', lmid.x + 60, lmid.y - 18);

  const leftEndSeg = sh.leftPath.linearSegments;
  const leftEndPt  = leftEndSeg[leftEndSeg.length - 1];

  // Moving ball on primary path
  if (sh.leftPhase === 'primary') {
    const lPos = linearPosAtDist(leftEndSeg, Math.min(sh.leftDist, linearSegLen(leftEndSeg)));
    c.save(); c.shadowBlur=12; c.shadowColor=RAW_COL; c.fillStyle=RAW_COL;
    c.beginPath(); c.arc(lPos.x,lPos.y,14,0,Math.PI*2); c.fill(); c.shadowBlur=0; c.restore();
  }

  // Raw burst (heavy): straight-line spikes, no Catmull-Rom
  if (sh.type === 'heavy' && (sh.leftPhase === 'rawburst' || sh.leftPhase === 'done')) {
    const alpha = sh.leftPhase === 'rawburst' ? 0.85 : 0.45;
    // Solid radial burst ring (static, no curve)
    c.save(); c.globalAlpha = alpha * 0.35;
    c.fillStyle = '#ff4400';
    c.beginPath(); c.arc(leftEndPt.x, leftEndPt.y, 80, 0, Math.PI*2); c.fill();
    c.restore();
    // Straight-line shard rays
    c.save(); c.globalAlpha = alpha; c.strokeStyle = '#ff8833'; c.lineWidth = 3;
    (sh.leftShardEndpoints || []).forEach(ep => {
      c.beginPath(); c.moveTo(leftEndPt.x, leftEndPt.y); c.lineTo(ep.x, ep.y); c.stroke();
      // dot at ray tip
      c.fillStyle = '#ff5500'; c.beginPath(); c.arc(ep.x,ep.y,5,0,Math.PI*2); c.fill();
    });
    c.restore();
    c.fillStyle = sh.leftPhase === 'rawburst' ? '#ff8833' : '#775533';
    c.font = 'bold 18px monospace'; c.textAlign = 'center';
    c.fillText(sh.leftPhase === 'rawburst' ? 'RAW BURST ✗' : '✗ Straight rays only', leftEndPt.x, leftEndPt.y - 90);
  }

  // Raw bounce (twin/spread): straight-line paths, no arc
  if (sh.type !== 'heavy' && (sh.leftBouncePaths||[]).length > 0) {
    sh.leftBouncePaths.forEach((lbp, bi) => {
      const isActive = bi <= sh.leftActiveBouncePath;
      const isDone   = sh.leftPhase === 'done';
      const alpha    = (isActive || isDone) ? 0.60 : 0.20;
      c.save(); c.globalAlpha = alpha; c.strokeStyle = '#ff9944'; c.lineWidth = 3;
      c.setLineDash([10, 6]);
      c.beginPath();
      lbp.linearSegments.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
      c.stroke(); c.setLineDash([]); c.restore();
    });
    // Moving ball on current raw bounce path
    if (sh.leftPhase === 'rawbounce') {
      const curLBP = sh.leftBouncePaths[sh.leftActiveBouncePath];
      const bPos = linearPosAtDist(curLBP.linearSegments,
        Math.min(sh.leftBounceActiveDist, linearSegLen(curLBP.linearSegments)));
      c.save(); c.shadowBlur=12; c.shadowColor='#ff9944'; c.fillStyle='#ff9944';
      c.beginPath(); c.arc(bPos.x,bPos.y,12,0,Math.PI*2); c.fill(); c.shadowBlur=0; c.restore();
      c.fillStyle='#ff8833'; c.font='bold 15px monospace'; c.textAlign='center';
      c.fillText(`Raw Bounce ${sh.leftActiveBouncePath+1}`, bPos.x, bPos.y-22);
    }
    if (sh.leftPhase === 'done') {
      const lastLP = sh.leftBouncePaths[sh.leftBouncePaths.length-1];
      const lastPt = lastLP.linearSegments[lastLP.linearSegments.length-1];
      c.fillStyle = '#885533'; c.font = '15px monospace'; c.textAlign = 'center';
      c.fillText('✗ Angular bounce — no smooth path', lastPt.x - 20, lastPt.y - 18);
    }
  }

  // (raw stats now drawn in the left terminal frame by renderDemoLab)

  // ===== RIGHT PANEL: full Catmull-Rom method =====

  // Primary Catmull-Rom path with sampled points
  c.save(); c.globalAlpha=0.55; c.strokeStyle=MET_COL; c.lineWidth=3;
  c.beginPath();
  sh.rightPrimary.curvePoints.forEach((p,i)=>i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
  c.stroke();
  c.globalAlpha=0.55;
  sh.rightPrimary.curvePoints.forEach((p,i)=>{if(i%8===0){c.beginPath();c.arc(p.x,p.y,4,0,Math.PI*2);c.fillStyle=COL.sampled;c.fill();}});
  c.restore();

  // Waypoints P0-P3
  sh.rightPrimary.waypoints.forEach((wp,i)=>{
    c.beginPath();c.arc(wp.x,wp.y,7,0,Math.PI*2);c.fillStyle=COL.waypoint;c.fill();
    c.fillStyle='#000';c.font='bold 11px monospace';c.textAlign='center';c.fillText('P'+i,wp.x,wp.y+4);
  });

  // Function tag: buildCurve label
  const rmid = sh.rightPrimary.waypoints[1];
  c.save(); c.fillStyle='rgba(0,0,10,0.75)'; c.fillRect(rmid.x+10, rmid.y-35, 200, 22); c.restore();
  c.font='bold 13px monospace'; c.fillStyle='#00ffcc'; c.textAlign='left';
  c.fillText('buildCurve(P0–P3)', rmid.x + 14, rmid.y - 18);

  // Function tag: computeArcLengths label
  const rsamp = sh.rightPrimary.curvePoints[Math.floor(sh.rightPrimary.curvePoints.length * 0.55)];
  c.save(); c.fillStyle='rgba(0,0,10,0.75)'; c.fillRect(rsamp.x+8, rsamp.y-26, 210, 22); c.restore();
  c.font='bold 13px monospace'; c.fillStyle='#88ffcc'; c.textAlign='left';
  c.fillText('computeArcLengths()', rsamp.x + 10, rsamp.y - 10);

  const endPt=sh.rightPrimary.curvePoints[sh.rightPrimary.curvePoints.length-1];

  // Numerical bounce paths (twin/spread)
  if (sh.type!=='heavy' && sh.bouncePaths.length>0) {
    sh.bouncePaths.forEach((bp,bi)=>{
      const alpha = bi<=sh.rightActiveBouncePath ? 0.55 : 0.22;
      c.save(); c.globalAlpha=alpha; c.strokeStyle='#88ffcc'; c.lineWidth=2.5; c.setLineDash([8,5]);
      c.beginPath();bp.curvePoints.forEach((p,i)=>i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
      c.stroke();c.setLineDash([]);
      c.globalAlpha=alpha*0.9;
      bp.curvePoints.forEach((p,i)=>{if(i%8===0){c.beginPath();c.arc(p.x,p.y,3,0,Math.PI*2);c.fillStyle='#aaffcc';c.fill();}});
      c.restore();
      // Label bounce paths with rebuildBouncePath tag
      if (bi === 0) {
        const bLabelPt = bp.curvePoints[Math.floor(bp.curvePoints.length * 0.3)];
        c.save(); c.fillStyle='rgba(0,0,10,0.75)'; c.fillRect(bLabelPt.x+6, bLabelPt.y-27, 210, 22); c.restore();
        c.font='bold 13px monospace'; c.fillStyle='#77ff99'; c.textAlign='left';
        c.fillText('rebuildBouncePath()', bLabelPt.x + 8, bLabelPt.y - 10);
      }
    });
  }

  // Heavy shard paths (Catmull-Rom shards)
  if (sh.type==='heavy' && (sh.rightPhase==='burst'||sh.rightPhase==='done')) {
    sh.shardPaths.forEach(sp=>{
      c.save(); c.globalAlpha=sh.rightPhase==='burst'?0.75:0.35;
      c.strokeStyle='#ffcc44'; c.lineWidth=2;
      c.beginPath();sp.curvePoints.forEach((p,i)=>i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));c.stroke();
      c.restore();
    });
    // Function tag on shard paths
    if (sh.shardPaths.length > 0) {
      const shardMid = sh.shardPaths[0].curvePoints[Math.floor(sh.shardPaths[0].curvePoints.length * 0.5)];
      c.save(); c.fillStyle='rgba(0,0,10,0.75)'; c.fillRect(shardMid.x+6, shardMid.y-27, 196, 22); c.restore();
      c.font='bold 13px monospace'; c.fillStyle='#ffdd55'; c.textAlign='left';
      c.fillText('buildCurve() shard', shardMid.x + 8, shardMid.y - 8);
    }
    if (sh.rightPhase==='burst') {
      const ratio=1-sh.burstTimer/1.8;
      const ringR=Math.max(2,HEAVY_IMPACT_RADIUS*ratio);
      c.save(); c.globalAlpha=sh.burstTimer/1.8;
      c.fillStyle='#ff880022';c.beginPath();c.arc(endPt.x,endPt.y,HEAVY_IMPACT_RADIUS,0,Math.PI*2);c.fill();
      c.strokeStyle='#ff8800';c.lineWidth=6;
      c.beginPath();c.arc(endPt.x,endPt.y,ringR,0,Math.PI*2);c.stroke();
      c.restore();
      c.save();c.fillStyle='#ffcc44';c.font='bold 20px monospace';c.textAlign='center';
      c.shadowBlur=14;c.shadowColor='#ffcc44';
      c.fillText('NUMERICAL BURST ✓',endPt.x,endPt.y-HEAVY_IMPACT_RADIUS-14);
      c.shadowBlur=0;c.restore();
    }
  }

  // Moving ball (right primary phase)
  if (sh.rightPhase==='primary') {
    const rPos=getPositionAtDistance(sh.rightPrimary.curvePoints,sh.rightPrimary.arcLengths,sh.rightDist);
    // Function tag near ball
    c.save(); c.fillStyle='rgba(0,0,10,0.80)'; c.fillRect(rPos.x-118,rPos.y-38,236,22); c.restore();
    c.font='bold 13px monospace'; c.fillStyle='#00ffee'; c.textAlign='center';
    c.fillText('getPositionAtDistance(d)', rPos.x, rPos.y - 22);
    c.save();c.shadowBlur=18;c.shadowColor=MET_COL;c.fillStyle=MET_COL;
    c.beginPath();c.arc(rPos.x,rPos.y,14,0,Math.PI*2);c.fill();c.shadowBlur=0;c.restore();
  } else if (sh.rightPhase==='bounce') {
    const curBP=sh.bouncePaths[sh.rightActiveBouncePath];
    const rPos=getPositionAtDistance(curBP.curvePoints,curBP.arcLengths,sh.rightBounceActiveDist);
    c.save(); c.fillStyle='rgba(0,0,10,0.80)'; c.fillRect(rPos.x-118,rPos.y-38,236,22); c.restore();
    c.font='bold 13px monospace'; c.fillStyle='#aaffcc'; c.textAlign='center';
    c.fillText('getPositionAtDistance(d)', rPos.x, rPos.y - 22);
    c.save();c.shadowBlur=18;c.shadowColor='#88ffcc';c.fillStyle='#88ffcc';
    c.beginPath();c.arc(rPos.x,rPos.y,12,0,Math.PI*2);c.fill();c.shadowBlur=0;c.restore();
    c.fillStyle='#ccffee';c.font='bold 15px monospace';c.textAlign='center';
    c.fillText(`Bounce ${sh.rightActiveBouncePath+1}`,rPos.x,rPos.y+28);
  }

  // (numerical stats now drawn in the right terminal frame by renderDemoLab)
}

// Interior rectangle of a terminal (below the title bar + subtitle line).
function demoPaneInterior(term) {
  const padX = 16, padBottom = 16, topReserve = 56;
  return { ix: term.x+padX, iy: term.y+topReserve, iw: term.w-padX*2, ih: term.h-topReserve-padBottom };
}

// Clip to a terminal interior and map a source-space rect into it with uniform
// scale (no distortion), then run fn() which draws Demo Lab visuals in source coords.
function drawDemoPaneContent(c, term, srcX, srcY, srcW, srcH, fn) {
  const { ix, iy, iw, ih } = demoPaneInterior(term);
  const scale = Math.min(iw/srcW, ih/srcH);
  const dw = srcW*scale, dh = srcH*scale;
  const ox = ix + (iw-dw)/2, oy = iy + (ih-dh)/2;
  c.save();
  c.beginPath(); c.rect(ix, iy, iw, ih); c.clip();
  c.translate(ox, oy); c.scale(scale, scale); c.translate(-srcX, -srcY);
  fn();
  c.restore();
}

// Stat text block, drawn top-left inside a terminal over the visuals (dark backing).
function drawDemoStatBlock(c, term, lines, accent) {
  if (!lines || !lines.length) return;
  const bx = term.x + 18, by = term.y + 78;
  c.font='16px monospace';
  let maxw = 0;
  lines.forEach(l => { const w = c.measureText(l.t).width; if (w>maxw) maxw=w; });
  const boxW = Math.min(maxw + 24, term.w - 36);
  const boxH = lines.length*23 + 14;
  c.save();
  c.fillStyle='rgba(2,8,18,0.80)';
  c.strokeStyle = (accent||'#345')+'55'; c.lineWidth = 1;
  c.beginPath(); c.roundRect(bx-10, by-20, boxW, boxH, 4); c.fill(); c.stroke();
  c.textAlign='left';
  let yy = by;
  lines.forEach(l => { c.fillStyle = l.c || '#aabbcc'; c.fillText(l.t, bx, yy); yy += 23; });
  c.restore();
}

// Dash / Projectile / Meteor — visuals only, in source coords (no chrome/stats).
function drawDemoVisual(c, ent, isRight) {
  const panX = isRight ? DEMO_HW : 0;
  // Floor platform
  c.fillStyle = COL.plat;    c.fillRect(panX+50, 870, DEMO_HW-100, 30);
  c.fillStyle = COL.platTop; c.fillRect(panX+50, 870, DEMO_HW-100, 5);
  if (!ent || !ent.pathData) return;

  const pd = ent.pathData;
  const mode = ent.mode;

  // Full path
  c.save();
  c.globalAlpha = 0.55;
  if (mode === 'linear') {
    c.strokeStyle = COL.linear; c.lineWidth = 3; c.setLineDash([12,8]);
    c.beginPath();
    pd.linearSegments.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke(); c.setLineDash([]);
  } else {
    c.strokeStyle = COL.spline; c.lineWidth = 3; c.setLineDash([]);
    c.beginPath();
    pd.curvePoints.forEach((p,i) => i===0 ? c.moveTo(p.x,p.y) : c.lineTo(p.x,p.y));
    c.stroke();
    c.globalAlpha = 0.65;
    pd.curvePoints.forEach((p,i) => {
      if (i % 8 === 0) { c.beginPath(); c.arc(p.x,p.y,4,0,Math.PI*2); c.fillStyle = COL.sampled; c.fill(); }
    });
  }
  c.restore();

  // Waypoints
  c.save(); c.globalAlpha = 0.9;
  pd.waypoints.forEach((wp,i) => {
    c.beginPath(); c.arc(wp.x, wp.y, 8, 0, Math.PI*2);
    c.fillStyle = COL.waypoint; c.fill();
    c.fillStyle = '#111'; c.font = 'bold 13px monospace'; c.textAlign = 'center';
    c.fillText('P'+i, wp.x, wp.y+5);
  });
  c.restore();

  // Moving entity
  c.save(); c.globalAlpha = 1;
  const ec = isRight ? COL.spline : COL.linear;
  if (ent.type === 'meteor') {
    if (ent.warningTimer > 0) {
      const pulse = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 280));
      c.globalAlpha = 0.55 + 0.3 * pulse;
      c.strokeStyle = '#ffee44'; c.lineWidth = 4.5; c.setLineDash([16, 9]);
      c.beginPath();
      pd.curvePoints.forEach((p,i) => i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y));
      c.stroke(); c.setLineDash([]);
      c.globalAlpha = 0.75 + 0.25 * pulse;
      c.fillStyle = '#ffee44'; c.font = 'bold 22px monospace'; c.textAlign = 'center';
      c.shadowBlur = 16; c.shadowColor = '#ffee44';
      c.fillText('⚠  METHOD STORM WARNING  ⚠', panX + DEMO_HW/2, DESIGN_HEIGHT/2 - 10);
      c.shadowBlur = 0;
    } else {
      c.shadowBlur = 26; c.shadowColor = '#ffee66';
      c.fillStyle = '#ffee66';
      c.beginPath(); c.arc(ent.x, ent.y, 22, 0, Math.PI*2); c.fill();
      c.shadowBlur = 0;
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(ent.x, ent.y, 9, 0, Math.PI*2); c.fill();
    }
  } else {
    if (!isRight) { c.shadowBlur = 0; }
    else { c.shadowBlur = 18; c.shadowColor = COL.spline; }
    if (ent.type === 'dash') {
      c.fillStyle = ec; c.fillRect(ent.x - 20, ent.y - 35, 40, 70);
    } else {
      c.fillStyle = ec; c.beginPath(); c.arc(ent.x, ent.y, 14, 0, Math.PI*2); c.fill();
    }
    c.shadowBlur = 0;
  }
  c.restore();
}

// Large readable pipeline strip for the bottom terminal.
function drawDemoPipelineLine(c, x, y, mode) {
  const stages = [
    { name:'Waypoints',          ok:true },
    { name:'Catmull-Rom',        ok: mode!=='linear' },
    { name:'Arc Length',         ok: mode==='full' },
    { name:'Reparameterization', ok: mode==='full' },
  ];
  c.textAlign='left'; c.font='bold 17px monospace';
  c.fillStyle='#88aacc'; c.fillText('PIPELINE: ', x, y);
  let cx = x + c.measureText('PIPELINE: ').width;
  stages.forEach((s,i) => {
    const label = s.name + (s.ok ? ' ✓' : ' ✗');
    c.fillStyle = s.ok ? '#55ee88' : '#ff6666';
    c.fillText(label, cx, y);
    cx += c.measureText(label).width;
    if (i < stages.length-1) {
      c.fillStyle = '#6688aa'; c.fillText('  →  ', cx, y);
      cx += c.measureText('  →  ').width;
    }
  });
}
