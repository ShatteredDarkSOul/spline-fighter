  ln('─── Power-Ups ───', '#556677');
  const pu1str = op1.powerUp ? `${PU_LABEL[op1.powerUp.type] || op1.powerUp.type} ${op1.powerUp.timer.toFixed(1)}s` : 'None';
  const pu2str = op2.powerUp ? `${PU_LABEL[op2.powerUp.type] || op2.powerUp.type} ${op2.powerUp.timer.toFixed(1)}s` : 'None';
  const pu1col = op1.powerUp ? (PU_COL[op1.powerUp.type] || '#fff') : '#555';
  const pu2col = op2.powerUp ? (PU_COL[op2.powerUp.type] || '#fff') : '#555';
  ln(`P1: ${pu1str}`, pu1col);
  ln(`P2: ${pu2str}`, pu2col); ly += 4;
  ln('─── Shot Enhance ───', '#556677');
  const p1enh = op1.shotEnhanceActive ? `ACTIVE ${op1.shotEnhanceTimer.toFixed(1)}s [${(SHOT_NAME[op1.activeShotMode]||'').toUpperCase()}]`
    : op1.shotEnhanceCooldown > 0 ? `CD ${op1.shotEnhanceCooldown.toFixed(1)}s` : 'READY';
  const p2enh = op2.shotEnhanceActive ? `ACTIVE ${op2.shotEnhanceTimer.toFixed(1)}s [${(SHOT_NAME[op2.activeShotMode]||'').toUpperCase()}]`
    : op2.shotEnhanceCooldown > 0 ? `CD ${op2.shotEnhanceCooldown.toFixed(1)}s` : 'READY';
  ln(`P1 ${SHOT_NAME[op1.shotMode]}: ${p1enh}`, op1.shotEnhanceActive ? '#ffee44' : '#888899');
  ln(`P2 ${SHOT_NAME[op2.shotMode]}: ${p2enh}`, op2.shotEnhanceActive ? '#ffee44' : '#888899'); ly += 4;
  // Permanent stat mods (compact — only non-default)
  const _sm1 = op1.statMods, _sm2 = op2.statMods;
  const _fmv = v => v.toFixed(2) + 'x';
  const _mp1 = [], _mp2 = [];
  if (Math.abs(_sm1.projectileSpeedMult   -1)>0.005) _mp1.push(`PS${_fmv(_sm1.projectileSpeedMult)}`);
  if (Math.abs(_sm1.projectileCooldownMult-1)>0.005) _mp1.push(`PC${_fmv(_sm1.projectileCooldownMult)}`);
  if (Math.abs(_sm1.dashSpeedMult         -1)>0.005) _mp1.push(`DS${_fmv(_sm1.dashSpeedMult)}`);
  if (Math.abs(_sm1.dashCooldownMult      -1)>0.005) _mp1.push(`DC${_fmv(_sm1.dashCooldownMult)}`);
  if (Math.abs(_sm1.shieldRegenMult       -1)>0.005) _mp1.push(`SR${_fmv(_sm1.shieldRegenMult)}`);
  if (Math.abs(_sm2.projectileSpeedMult   -1)>0.005) _mp2.push(`PS${_fmv(_sm2.projectileSpeedMult)}`);
  if (Math.abs(_sm2.projectileCooldownMult-1)>0.005) _mp2.push(`PC${_fmv(_sm2.projectileCooldownMult)}`);
  if (Math.abs(_sm2.dashSpeedMult         -1)>0.005) _mp2.push(`DS${_fmv(_sm2.dashSpeedMult)}`);
  if (Math.abs(_sm2.dashCooldownMult      -1)>0.005) _mp2.push(`DC${_fmv(_sm2.dashCooldownMult)}`);
  if (Math.abs(_sm2.shieldRegenMult       -1)>0.005) _mp2.push(`SR${_fmv(_sm2.shieldRegenMult)}`);
  if (_mp1.length || _mp2.length) {
    ln(`P1 Mods: ${_mp1.slice(0,3).join(' ') || 'none'}`, '#88ccaa');
    ln(`P2 Mods: ${_mp2.slice(0,3).join(' ') || 'none'}`, '#88ccaa');
    ly += 4;
  }
  // Match time + storm level
  const _matchMin = Math.floor(GS.matchTime / 60);
  const _matchSec = Math.floor(GS.matchTime % 60);
  const _tStr = `${_matchMin}:${_matchSec.toString().padStart(2,'0')}`;
  const _stLv2 = getStormLevel();
  const _mCfg2 = getMeteorSpawnConfig();
  const _activeMCount = GS.meteors.filter(m => m.active).length;
  ln(`Time: ${_tStr}   Storm: Lv ${_stLv2}`, '#aaddff'); ly += 4;
  // Arena event line
  const _anyM = GS.meteors.find(m => m.active);
  const _hasWarn = _anyM && _anyM.phase === 'warning';
  const _evtStr = _hasWarn ? '⚠ WARNING: Meteor!' : `Meteors: ${_activeMCount}/${_mCfg2.maxActive}  Next: ${GS.meteorTimer.toFixed(1)}s`;
  const _evtCol = _hasWarn ? '#ffee44' : _activeMCount > 0 ? '#ff8833' : GS.meteorTimer < 5 ? '#ffdd44' : '#445566';
  ln(`Arena: ${_evtStr}`, _evtCol);

  // Left panel — controls
  const cw = 390, ch = 262, cx2 = 16, cy2 = 16;
  c.fillStyle = 'rgba(0,0,8,0.78)';
  c.strokeStyle = '#334455'; c.lineWidth = 1.5;
  c.beginPath(); c.rect(cx2, cy2, cw, ch); c.fill(); c.stroke();

  lx = cx2+14; ly = cy2+24;
  ln('CONTROLS', '#ffffff', true); ly += 2;
  ln('P1: A/D move  W jump  F atk  S:Guard', COL.p1);
  ln('    G:Dash  H:Proj  C:Shot  V:Enhance', COL.p1);
  ln('P2: ←/→ move  ↑ jump  K atk  ↓:Guard', COL.p2);
  ln('    L:Dash  ;:Proj  N:Shot  M:Enhance', COL.p2);
  ln('1/2/3:Method  TAB:Demo  P:Practice', '#aaaacc');
  ln('I:VS AI  R:Reset  \\:Hitbox Debug', '#aaaacc');
  ln('C/N: cycle shot (Heavy→Twin→Spread)', '#bbaaff');
  ln('Demo: G:Dash  H:Proj  M:Meteor  U:PU  B:Impact', '#aaaacc');
}


// =====================================================
// 14. MAIN GAME LOOP
// =====================================================

function renderAll(ts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  withVirtual(c => {
    if (UI.menuOpen) {
      drawMenuScene(c);        // zoom-out transition + CRT bg + remote + menu text
    } else if (GS.mode === 'demoLab') {
      renderDemoLab(c);
    } else {
      renderGame(c);
      drawCRTOverlay(c);       // CRT scanlines + vignette over world
      drawFourTerminalHUD(c);  // four terminal panels drawn sharp above CRT
    }
  });
}

function loop(ts) {
  update(ts);
  renderAll(ts);
  requestAnimationFrame(loop);
}

// Boot
loadAssets();
initGameState();
resizeCanvas();
requestAnimationFrame(ts => { prevTime = ts; loop(ts); });
</script>
</body>
</html>
