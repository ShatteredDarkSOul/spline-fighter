// =====================================================
// 3. NUMERICAL METHODS
// =====================================================

/*
 * Catmull-Rom Interpolation:
 * B(t) = 0.5 * [
 *   2*P1
 *   + (-P0 + P2)*t
 *   + (2*P0 - 5*P1 + 4*P2 - P3)*t^2
 *   + (-P0 + 3*P1 - 3*P2 + P3)*t^3
 * ]
 * where t in [0,1], result interpolates from P1 (t=0) to P2 (t=1)
 */
function catmullRomSegment(P0, P1, P2, P3, t) {
  const t2 = t * t, t3 = t2 * t;
  return {
    x: 0.5*(2*P1.x + (-P0.x+P2.x)*t + (2*P0.x-5*P1.x+4*P2.x-P3.x)*t2 + (-P0.x+3*P1.x-3*P2.x+P3.x)*t3),
    y: 0.5*(2*P1.y + (-P0.y+P2.y)*t + (2*P0.y-5*P1.y+4*P2.y-P3.y)*t2 + (-P0.y+3*P1.y-3*P2.y+P3.y)*t3),
  };
}

function buildCurve(waypoints, stepsPerSegment) {
  const n = waypoints.length;
  const chain = [waypoints[0], ...waypoints, waypoints[n-1]];
  const result = [];
  for (let i = 0; i < chain.length - 3; i++) {
    const skip = i === 0 ? 0 : 1;
    for (let s = skip; s <= stepsPerSegment; s++) {
      result.push(catmullRomSegment(chain[i], chain[i+1], chain[i+2], chain[i+3], s/stepsPerSegment));
    }
  }
  return result;
}

/*
 * Riemann-Sum Arc-Length Approximation:
 * L ≈ Σ sqrt( (x[i+1]-x[i])^2 + (y[i+1]-y[i])^2 )
 * Returns cumulative arc-length array starting at 0.
 */
function computeArcLengths(curvePoints) {
  const L = [0];
  for (let i = 1; i < curvePoints.length; i++) {
    const dx = curvePoints[i].x - curvePoints[i-1].x;
    const dy = curvePoints[i].y - curvePoints[i-1].y;
    L.push(L[i-1] + Math.sqrt(dx*dx + dy*dy));
  }
  return L;
}

/*
 * Linear Interpolation for Arc-Length Reparameterization:
 * t_local = (d_target - L[i-1]) / (L[i] - L[i-1])
 * position = (1 - t_local)*point[i-1] + t_local*point[i]
 * Finds bracketing arc-length entries, then lerps between them.
 */
function getPositionAtDistance(curvePoints, arcLengths, distance) {
  const total = arcLengths[arcLengths.length-1];
  if (distance <= 0) return { x:curvePoints[0].x, y:curvePoints[0].y };
  if (distance >= total) return { x:curvePoints[curvePoints.length-1].x, y:curvePoints[curvePoints.length-1].y };
  let lo = 0, hi = arcLengths.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    arcLengths[mid] < distance ? lo = mid : hi = mid;
  }
  const span = arcLengths[hi] - arcLengths[lo];
  const t_local = span > 0 ? (distance - arcLengths[lo]) / span : 0;
  return {
    x: (1-t_local)*curvePoints[lo].x + t_local*curvePoints[hi].x,
    y: (1-t_local)*curvePoints[lo].y + t_local*curvePoints[hi].y,
  };
}

const keys = {};

window.addEventListener('keydown', e => {
  // While typing in the VS ONLINE overlay inputs, don't let keys leak into the game.
  if (e.target && e.target.closest && e.target.closest('#net-overlay')) return;
  const wasDown = keys[e.key];
  keys[e.key] = true;

  // TV Menu — handled before anything else
  if (e.key === 'Escape') {
    e.preventDefault();
    if (UI.menuPhase === 'opening' || UI.menuPhase === 'closing') return;
    if (UI.menuOpen && UI.menuPage !== 'main') { UI.menuPage = 'main'; triggerMenuPageFlash(0.85); return; }
    if (UI.menuOpen) {
      UI.menuPhase = 'closing';
      UI.menuSel = 0; UI.menuPage = 'main';
      triggerMenuPageFlash(1.0);
    } else {
      UI.menuOpen = true; UI.menuPhase = 'opening';
      UI.menuAnim = 0; UI.menuSel = 0; UI.menuPage = 'main';
      UI.remoteState = 'idle'; UI.remoteTimer = 0; UI.remoteBounce = 0;
      triggerMenuPageFlash(1.0);
    }
    return;
  }
  if (UI.menuOpen) {
    if (UI.menuPhase !== 'active') { return; } // block input during transitions
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      UI.menuSel = (UI.menuSel - 1 + MENU_OPTIONS.length) % MENU_OPTIONS.length;
      UI.remoteState = 'up'; UI.remoteTimer = 0.15; UI.remoteBounce = 0;
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      UI.menuSel = (UI.menuSel + 1) % MENU_OPTIONS.length;
      UI.remoteState = 'down'; UI.remoteTimer = 0.15; UI.remoteBounce = 0;
      return;
    }
    if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') {
      UI.remoteState = 'ok'; UI.remoteTimer = 0.18; UI.remoteBounce = 0;
      UI.selectFlash = 0.18;
      handleMenuSelect();
      return;
    }
    return; // block all game input while menu is open
  }

  if (e.key === 'Tab') { e.preventDefault(); toggleDemoLab(); return; }
  if (e.key === ' ')   { if (GS.mode==='demoLab') { e.preventDefault(); restartDemo(); } return; }
  if (e.key === 'ArrowDown' && GS.mode !== 'demoLab') { e.preventDefault(); }
  if (e.key === '1')   { GS.methodMode = 'linear';  return; }
  if (e.key === '2')   { GS.methodMode = 'catmull'; return; }
  if (e.key === '3')   { GS.methodMode = 'full';    return; }
  if (e.key === 'r' || e.key === 'R') {
    // Online reset would desync the peers (not server-authoritative yet) — guard it.
    if (GS.mode === 'online') {
      GS.floatTexts.push({ x:DESIGN_WIDTH/2, y:DESIGN_HEIGHT/2-30, text:'Online reset is not available yet.', color:'#ff8833', life:2.0, maxLife:2.0, size:22 });
      return;
    }
    resetMatch(); return;
  }
  if (e.key === 'p' || e.key === 'P') { togglePractice(); return; }
  if (e.key === 'i' || e.key === 'I') { toggleAI(); return; }
  if (e.key === '\\')  { GS.showHitbox = !GS.showHitbox; return; }

  if (GS.mode !== 'demoLab') {
    if (!wasDown && (e.key === 'c' || e.key === 'C')) { cycleShotMode(GS.players[0]); return; }
    if (!wasDown && (e.key === 'v' || e.key === 'V')) { tryActivateEnhance(GS.players[0]); return; }
    if (!wasDown && (e.key === 'n' || e.key === 'N')) { cycleShotMode(GS.players[1]); return; }
    if (!wasDown && (e.key === 'm' || e.key === 'M')) { tryActivateEnhance(GS.players[1]); return; }
  }

  if (GS.mode === 'demoLab') {
    if (e.key === 'g' || e.key === 'G') { DS.comparison='dash';       restartDemo(); return; }
    if (e.key === 'h' || e.key === 'H') { DS.comparison='projectile'; restartDemo(); return; }
    if (e.key === 'u' || e.key === 'U') { DS.comparison='powerups';   restartDemo(); return; }
    if (e.key === 'm' || e.key === 'M') { DS.comparison='meteor';     restartDemo(); return; }
    if (e.key === 'b' || e.key === 'B') { DS.comparison='impact';     restartDemo(); return; }
    if (DS.comparison === 'impact' && DS.impactShowcase) {
      const _itypes = ['heavy','twin','spread'];
      if (e.key === 'q' || e.key === 'Q') {
        const idx = _itypes.indexOf(DS.impactShowcase.type);
        DS.impactShowcase = { type: _itypes[(idx + 2) % 3] };
        restartDemo(); return;
      }
      if (e.key === 'e' || e.key === 'E') {
        const idx = _itypes.indexOf(DS.impactShowcase.type);
        DS.impactShowcase = { type: _itypes[(idx + 1) % 3] };
        restartDemo(); return;
      }
    }
    if (DS.comparison === 'powerups' && DS.puShowcase) {
      const _mods = ['curveAmplifier','sampleDensityBoost','constantSpeedSurge'];
      if (e.key === 'q' || e.key === 'Q') {
        const idx = _mods.indexOf(DS.puShowcase.module);
        DS.puShowcase.module = _mods[(idx + 2) % 3];
        DS.puShowcase.distRaw = 0; DS.puShowcase.distMethod = 0;
        DS.puShowcase.cachedRawPath = null; DS.puShowcase.cachedMethodPath = null; return;
      }
      if (e.key === 'e' || e.key === 'E') {
        const idx = _mods.indexOf(DS.puShowcase.module);
        DS.puShowcase.module = _mods[(idx + 1) % 3];
        DS.puShowcase.distRaw = 0; DS.puShowcase.distMethod = 0;
        DS.puShowcase.cachedRawPath = null; DS.puShowcase.cachedMethodPath = null; return;
      }

      }
      if (e.key === 'ArrowRight') {

        DS.puShowcase.cachedRawPath = null; DS.puShowcase.cachedMethodPath = null; return;
      }
    }
  }
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

function isDown(k) { return !!keys[k]; }

function toggleDemoLab() {

function togglePractice() {

// =====================================================
// 5b. ONLINE / NETWORK BOOTSTRAP
// =====================================================
// Wires the VS ONLINE HTML overlay to window.SplineNet (the Vite-bundled
// networking module). Fully optional: if SplineNet failed to load, the overlay
// reports it and every local mode keeps working untouched.

const netEls = {
  overlay:   document.getElementById('net-overlay'),
  url:       document.getElementById('net-url'),
  connect:   document.getElementById('net-connect'),
  create:    document.getElementById('net-create'),
  roomcode:  document.getElementById('net-roomcode'),
  roomInput: document.getElementById('net-room-input'),
  join:      document.getElementById('net-join'),
  status:    document.getElementById('net-status'),
  close:     document.getElementById('net-close'),
};

let netWired = false; // SplineNet.onEvent registered once

function openNetOverlay() {
  if (!netEls.overlay) return;
  netEls.overlay.classList.add('open');
  wireSplineNet();
  renderNetStatus();
  // Prefill last-used URL if remembered this session.
  if (!netEls.url.value && window._lastServerUrl) netEls.url.value = window._lastServerUrl;
  setTimeout(() => netEls.url && netEls.url.focus(), 30);
}

function closeNetOverlay() {
  if (!netEls.overlay) return;
  netEls.overlay.classList.remove('open');
}

// Register SplineNet lifecycle callback once the module is present.
function wireSplineNet() {
  if (netWired || !window.SplineNet) return;
  netWired = true;
  window.SplineNet.onEvent = (type, payload) => {
    switch (type) {
      case 'room-created':
        netEls.roomcode.textContent = payload.code;
        break;
      case 'peer-joined':
        startOnlineMatch(payload.slot || SplineNet.state.slot);
        closeNetOverlay();
        break;
      case 'peer-left':
        endOnlineMatch('Opponent left the room.');
        break;
      case 'disconnected':
        if (GS.mode === 'online') endOnlineMatch('Disconnected from server.');
        break;
    }
    renderNetStatus();
  };
}

// Start an online versus match. `slot` is 'p1' (host) or 'p2' (guest).
// The local player keeps keyboard control; the other slot becomes remote and
// reads its input from netInput (fed each frame in the update loop).
function startOnlineMatch(slot) {
  const mm = GS.methodMode, sh = GS.showHitbox;
  initGameState();
  GS.methodMode = mm; GS.showHitbox = sh;
  GS.mode = 'online';
  const remote = slot === 'p2' ? GS.players[0] : GS.players[1];
  remote.isRemote = true;
  remote.isAI = false;
  remote.isDummy = false;
  // Close the TV menu if it happens to be open.
  UI.menuOpen = false; UI.menuPhase = 'closed';
}

function endOnlineMatch(reason) {
  // Drop back to a local versus match; clear remote flags.
  if (GS.mode === 'online') {
    const mm = GS.methodMode, sh = GS.showHitbox;
    initGameState();
    GS.methodMode = mm; GS.showHitbox = sh;
    GS.mode = 'versus';
  }
  if (window.SplineNet) SplineNet.leaveRoom();
  if (reason) { openNetOverlay(); }
  renderNetStatus(reason);
}

// Escape any server-controlled string before it enters innerHTML below.
function escapeHtml(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function renderNetStatus(extra) {
  if (!netEls.status) return;
  const net = window.SplineNet;
  if (!net) {
    netEls.status.innerHTML = '<span class="err">Networking module not loaded.</span>\nServe over http(s), not file://, then reopen.';
    netEls.create.disabled = true; netEls.join.disabled = true;
    return;
  }
  const s = net.state;
  const connected = net.isConnected();
  netEls.create.disabled = !connected;
  netEls.join.disabled = !connected;

  let lines = [];
  if (extra) lines.push('<span class="err">' + escapeHtml(extra) + '</span>');
  if (s.status === 'connecting') lines.push('Connecting…');
  else if (connected) {
    lines.push('<span class="ok">Connected</span>' + (s.latency != null ? '  ·  ' + s.latency + ' ms' : ''));
    if (s.room) lines.push('Room ' + escapeHtml(s.room) + (s.slot ? '  (' + (s.slot === 'p1' ? 'P1 / host' : 'P2 / guest') + ')' : ''));
    if (s.room && !s.peerPresent) lines.push('Waiting for opponent…');
    if (s.peerPresent) lines.push('<span class="ok">Opponent connected — fight!</span>');
  } else if (s.status === 'error') {
    lines.push('<span class="err">Connection failed.</span>' + (s.lastError ? '\n' + escapeHtml(s.lastError) : ''));
  } else {
    lines.push('Not connected.');
  }
  netEls.status.innerHTML = lines.join('\n');
}

// ── Overlay button wiring (DOM elements already parsed above this script) ──
if (netEls.overlay) {
  netEls.connect.addEventListener('click', () => {
    const net = window.SplineNet;
    if (!net) { renderNetStatus(); return; }
    const url = netEls.url.value.trim();
    if (!url) { renderNetStatus('Enter a server URL first.'); return; }
    window._lastServerUrl = url;
    renderNetStatus();
    netEls.status.innerHTML = 'Connecting…';
    net.connect(url).then(() => renderNetStatus()).catch(() => renderNetStatus());
  });
  netEls.create.addEventListener('click', () => {
    if (window.SplineNet) { window.SplineNet.createRoom(); }
  });
  netEls.join.addEventListener('click', () => {
    if (window.SplineNet) { window.SplineNet.joinRoom(netEls.roomInput.value); renderNetStatus(); }
  });
  netEls.roomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') netEls.join.click();
  });
  netEls.close.addEventListener('click', closeNetOverlay);
  // Poll status so latency / waiting-state stay fresh while the overlay is open.
  setInterval(() => { if (netEls.overlay.classList.contains('open')) renderNetStatus(); }, 1000);
}

// =====================================================
// 6. ARENA AND PHYSICS
// =====================================================

function getInput(player, dir) {
  if (player.isRemote) return !!player.netInput[dir];
  if (player.isAI) return !!player.aiInput[dir];
  return isDown(player.controls[dir]);
}

function physicsStep(player, dt) {
  if (player.ability.active && player.ability.type === 'dash') return;

  player.vy += GRAVITY * dt;

  if (!player.isDummy) {
    if (player.hitStunTimer > 0 || player.guardBrokenTimer > 0) {
      player.vx *= 0.78; if (Math.abs(player.vx) < 2) player.vx = 0;
    } else if (player.guarding) {
      player.vx *= 0.5; if (Math.abs(player.vx) < 5) player.vx = 0;
    } else {
      const left  = getInput(player, 'left');
      const right = getInput(player, 'right');
      if (left)       { player.vx = -MOVE_SPEED; player.facing = -1; }
      else if (right) { player.vx =  MOVE_SPEED; player.facing =  1; }
      else            { player.vx *= 0.78; if (Math.abs(player.vx) < 2) player.vx = 0; }
    }
  } else {
    player.vx = 0;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.onGround = false;
  for (const plat of PLATFORMS) resolvePlatform(player, plat, dt);

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.hitbox.width > DESIGN_WIDTH) { player.x = DESIGN_WIDTH - player.hitbox.width; player.vx = 0; }

  if (player.y > FALL_DEATH_Y) {
    const scorer = player.id === 1 ? 2 : 1;
    loseStock(player, scorer);
  }
}

function resolvePlatform(player, plat, dt) {
  const pw = player.hitbox.width, ph = player.hitbox.height;
  if (player.x + pw <= plat.x || player.x >= plat.x + plat.width) return;
  if (player.y + ph <= plat.y || player.y >= plat.y + plat.height) return;
  const prevBottom = (player.y + ph) - player.vy * dt;
  if (prevBottom <= plat.y + 4 && player.vy >= 0) {
    player.y = plat.y - ph;
    player.vy = 0;
    player.onGround = true;
  }
}

function tryJump(player) {
  if (player.isDummy || player.guarding || player.guardBrokenTimer > 0) return;
  const held = getInput(player, 'jump');
  if (player.onGround) player.jumpsUsed = 0;
  if (held && !player.jumpHeld && player.jumpsUsed < player.maxJumps) {
    player.vy = JUMP_SPEED;
    player.onGround = false;
    player.jumpsUsed++;
    player.jumpHeld = true;
  }
  if (!held) player.jumpHeld = false;
}

// =====================================================
// 7. ABILITY PATH GENERATION
// =====================================================

function lerp(a, b, t) { return a + (b - a) * t; }

// Directional charge dash — endpoint based on facing + distance, NOT enemy position
function makeDashPathDir(px, py, facing, dashDistance, curveOffset=DASH_CURVE_OFFSET_NORMAL, steps=STEPS_PER_SEG) {
  const P0 = { x:px - facing*60, y:py };
  const P1 = { x:px, y:py };
  const P2 = { x:px + facing * dashDistance * 0.5, y:py - curveOffset };
  const P3 = { x:px + facing * dashDistance, y:py };

  const wpts = [P0, P1, P2, P3];
  const cpts = buildCurve(wpts, steps);
  const arcs = computeArcLengths(cpts);
  const total = arcs[arcs.length-1];
  return { waypoints:wpts, curvePoints:cpts, arcLengths:arcs, totalLength:total, linearSegments:wpts };
}

function makeProjectilePath(px, py, tx, ty, facing, arcHeight=PROJ_ARC_HEIGHT_NORMAL, steps=STEPS_PER_SEG) {
  const P0 = { x:px - facing*20, y:py };
  const P1 = { x:px + facing*10, y:py };
  const midX = (px+tx)/2, midY = (py+ty)/2;
  const P2 = { x:midX, y:midY - arcHeight };
  const P3 = { x:tx, y:ty };

  const wpts = [P0, P1, P2, P3];
  const cpts = buildCurve(wpts, steps);
  const arcs = computeArcLengths(cpts);
  const total = arcs[arcs.length-1];
  return {
    waypoints:wpts, curvePoints:cpts, arcLengths:arcs, totalLength:total,
    linearSegments:wpts,
  };
}

function linearSegLen(segs) {
  let l = 0;
  for (let i = 1; i < segs.length; i++) {
    const dx = segs[i].x-segs[i-1].x, dy = segs[i].y-segs[i-1].y;
    l += Math.sqrt(dx*dx+dy*dy);
  }
  return l;
}

function linearPosAtDist(segs, dist) {
  let traveled = 0;
  for (let i = 1; i < segs.length; i++) {
    const dx = segs[i].x-segs[i-1].x, dy = segs[i].y-segs[i-1].y;
    const segL = Math.sqrt(dx*dx+dy*dy);
    if (traveled + segL >= dist) {
      const t = segL > 0 ? (dist-traveled)/segL : 0;
      return { x:segs[i-1].x+dx*t, y:segs[i-1].y+dy*t };
    }
    traveled += segL;
  }
  return { x:segs[segs.length-1].x, y:segs[segs.length-1].y };
}

// Equal time per segment: each segment gets same duration regardless of length.
// Long segments appear fast, short ones slow — visibly inconsistent speed.
function linearPosEqualTime(segs, progress) {
  const n = segs.length - 1;
  if (n <= 0) return { x:segs[0].x, y:segs[0].y };
  const sp = Math.min(progress * n, n - 1e-6);
  const idx = Math.floor(sp);
  const t = sp - idx;
  const a = segs[idx], b = segs[idx+1];
  return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t };
}

function posOnPath(pathData, dist, mode) {
  if (mode === 'linear') {
    const total = linearSegLen(pathData.linearSegments);
    const progress = total > 0 ? Math.min(dist / total, 1) : 0;
    return linearPosEqualTime(pathData.linearSegments, progress);
  }
  if (mode === 'catmull') {
    // raw parameter (uniform index) — speed varies noticeably
    const frac = Math.min(dist / pathData.totalLength, 1);
    const idx = Math.min(Math.floor(frac * (pathData.curvePoints.length-1)), pathData.curvePoints.length-1);
    return { x:pathData.curvePoints[idx].x, y:pathData.curvePoints[idx].y };
  }
  // full: arc-length reparameterization → constant speed
  return getPositionAtDistance(pathData.curvePoints, pathData.arcLengths, dist);
}

function totalLen(pathData, mode) {
  return mode === 'linear' ? linearSegLen(pathData.linearSegments) : pathData.totalLength;
}

// Track last-used variant to avoid identical back-to-back paths
let _lastMeteorVariant = -1;

// Generates a curved arena-crossing meteor path using the full numerical pipeline
function makeMeteorPath(variant) {
  let v;
  if (variant !== undefined) {
    v = variant;
  } else {
    const candidates = [0, 1, 2].filter(x => x !== _lastMeteorVariant);
    v = candidates[Math.floor(Math.random() * candidates.length)];
  }
  _lastMeteorVariant = v;
  const jit = () => (Math.random() - 0.5) * 160;
  let P0, P1, P2, P3;
  if (v === 0) {
    // Left-to-right arc
    P0 = { x:-80,   y:160+jit() }; P1 = { x:280,  y:290+jit() };
    P2 = { x:1020,  y:500+jit() }; P3 = { x:1900, y:920 };
  } else if (v === 1) {
    // Right-to-left arc
    P0 = { x:2000,  y:150+jit() }; P1 = { x:1640, y:260+jit() };
    P2 = { x:900,   y:490+jit() }; P3 = { x:20,   y:920 };
  } else {
    // Center-drop to one side
    const toRight = Math.random() < 0.5;
    P0 = { x:960+(toRight?-100:100), y:-60 };
    P1 = { x:960+(toRight?-200:200), y:200+jit() };
    P2 = { x:toRight?1320:600,        y:490+jit() };
    P3 = { x:toRight?1820:100,        y:920 };
  }
  const wpts = [P0,P1,P2,P3];
  const cpts = buildCurve(wpts, STEPS_PER_SEG);
  const arcs = computeArcLengths(cpts);
  return { waypoints:wpts, curvePoints:cpts, arcLengths:arcs, totalLength:arcs[arcs.length-1], linearSegments:wpts };
}

// =====================================================
// 8. ABILITY SYSTEM
// =====================================================

function getAbilityModifiers(player) {
  const pu = player.powerUp;
  const mods = {
    curveOffset: DASH_CURVE_OFFSET_NORMAL,
    projectileArcHeight: PROJ_ARC_HEIGHT_NORMAL,
    stepsPerSegment: STEPS_PER_SEG,
    dashSpeed: DASH_SPEED_NORMAL,
    projectileSpeed: PROJECTILE_SPEED_NORMAL,
    powerUpLabel: '',
  };
  if (!pu) return mods;
  if (pu.type === 'curveAmplifier')     { mods.curveOffset = DASH_CURVE_OFFSET_BOOSTED; mods.projectileArcHeight = PROJ_ARC_HEIGHT_BOOSTED; mods.powerUpLabel = ' [CURVE+]'; }
  if (pu.type === 'sampleDensityBoost') { mods.stepsPerSegment = STEPS_PER_SEG_BOOSTED; mods.powerUpLabel = ' [N+]'; }
  if (pu.type === 'constantSpeedSurge') { mods.dashSpeed = DASH_SPEED_SURGE; mods.projectileSpeed = PROJECTILE_SPEED_SURGE; mods.powerUpLabel = ' [SPEED+]'; }
  return mods;
}

function getDashDistance(chargeTime) {
  const ratio = Math.min(chargeTime / DASH_CHARGE_MAX, 1);
  return DASH_DIST_MIN + (DASH_DIST_MAX - DASH_DIST_MIN) * ratio;
}

function executeDash(player) {
  if (player.ability.active || player.cooldowns.dash > 0) return;
  const dist = getDashDistance(player.dashChargeTime);
  const px = player.x + player.hitbox.width/2;
  const py = player.y + player.hitbox.height/2;
  const mods = getAbilityModifiers(player);
  const effectiveMode = GS.methodMode;
  const pd = makeDashPathDir(px, py, player.facing, dist, mods.curveOffset, mods.stepsPerSegment);
  player.ability = { active:true, type:'dash', pathData:pd, distanceTraveled:0, speed:mods.dashSpeed * player.statMods.dashSpeedMult, mode:effectiveMode };
  player.cooldowns.dash = CD_MAX.dash * player.statMods.dashCooldownMult;
  player.dashCharging = false; player.dashChargeTime = 0; player.dashPreviewPath = null;
  statsInfo.actualSpeed = 0;
  const surgeLabel = (mods.dashSpeed > DASH_SPEED_NORMAL && effectiveMode === 'full')
    ? ' [Constant-Speed Surge]' : mods.powerUpLabel;
  statsInfo.abilityLabel = `P${player.id} Spline Dash [${METHOD_LABEL[effectiveMode]}] ${dist.toFixed(0)}px${surgeLabel}`;
}

function updateDashCharge(player, dt) {
  if (player.isDummy || player.ability.active || player.hitStunTimer > 0 || player.guarding || player.guardBrokenTimer > 0) {
    player.dashCharging = false; player.dashPreviewPath = null;
    return;
  }
  const keyHeld = getInput(player, 'dash');
  const canCharge = player.cooldowns.dash <= 0;

  if (keyHeld && canCharge) {
    player.dashCharging = true;
    player.dashChargeTime = Math.min(player.dashChargeTime + dt, DASH_CHARGE_MAX);
    if (player.dashChargeTime >= DASH_CHARGE_MIN) {
      const dist = getDashDistance(player.dashChargeTime);
      const px = player.x + player.hitbox.width/2;
      const py = player.y + player.hitbox.height/2;
      const mods = getAbilityModifiers(player);
      player.dashPreviewPath = makeDashPathDir(px, py, player.facing, dist, mods.curveOffset, mods.stepsPerSegment);
    }
  } else if (!keyHeld && player.dashCharging) {
    if (player.dashChargeTime >= DASH_CHARGE_MIN) executeDash(player);
    player.dashCharging = false; player.dashChargeTime = 0; player.dashPreviewPath = null;
  } else if (!keyHeld) {
    player.dashChargeTime = 0;
  }
}

function cycleShotMode(player) {
  const idx = SHOT_MODES.indexOf(player.shotMode);
  player.shotMode = SHOT_MODES[(idx + 1) % SHOT_MODES.length];
}

function tryActivateEnhance(player) {
  if (player.isDummy || player.hitStunTimer > 0 || player.guarding || player.guardBrokenTimer > 0 || player.shotEnhanceActive || player.shotEnhanceCooldown > 0) return;
  player.shotEnhanceActive = true;
  player.shotEnhanceTimer = SHOT_ENHANCE_DURATION;
  player.activeShotMode = player.shotMode;
}

function spawnProjectile(ownerId, px, py, pathData, opts) {
  GS.projectiles.push({
    active:true, ownerId, x:px, y:py,
    pathData, distanceTraveled:0,
    speed:opts.speed, mode:opts.mode,
    damage:opts.damage, hitRadius:opts.hitRadius,
    shotType:opts.shotType || 'normal',
    canImpact:        opts.canImpact        !== undefined ? opts.canImpact        : true,
    bouncesRemaining: opts.bouncesRemaining !== undefined ? opts.bouncesRemaining : 0,
    isShard:          opts.isShard          || false,
    generation:       opts.generation       || 0,
    justBounced:      false,
  });
}

function fireProjectileVariant(player, px, py, tx, ty, arcHeight, steps, opts) {
  const pd = makeProjectilePath(px, py, tx, ty, player.facing, arcHeight, steps);
  spawnProjectile(player.id, px, py, pd, opts);
}

function tryProjectile(player, target) {
  if (player.cooldowns.projectile > 0) return;
  const px = player.x + player.hitbox.width/2, py = player.y + player.hitbox.height/2;
  const tx = target.x  + target.hitbox.width/2, ty = target.y  + target.hitbox.height/2;
  const mods = getAbilityModifiers(player);
  const effectiveMode = GS.methodMode;
  statsInfo.actualSpeed = 0;
  player.cooldowns.projectile = CD_MAX.projectile * player.statMods.projectileCooldownMult;

  const baseOpts = { speed:mods.projectileSpeed * player.statMods.projectileSpeedMult, mode:effectiveMode };

  if (player.shotEnhanceActive) {
    const sm = player.activeShotMode;
    const ah = mods.projectileArcHeight;
    const st = mods.stepsPerSegment;
    if (sm === 'heavy') {
      fireProjectileVariant(player, px, py, tx, ty, ah, st, { ...baseOpts, damage:18, hitRadius:26, shotType:'heavy', bouncesRemaining:0 });
      statsInfo.abilityLabel = `P${player.id} HEAVY [${METHOD_LABEL[effectiveMode]}]${mods.powerUpLabel}`;
    } else if (sm === 'twin') {
      fireProjectileVariant(player, px, py, tx, ty, ah + 70, st, { ...baseOpts, damage:9, hitRadius:14, shotType:'twin', bouncesRemaining:2 });
      fireProjectileVariant(player, px, py, tx, ty, Math.max(ah - 70, 40), st, { ...baseOpts, damage:9, hitRadius:14, shotType:'twin', bouncesRemaining:2 });
      statsInfo.abilityLabel = `P${player.id} TWIN [${METHOD_LABEL[effectiveMode]}]${mods.powerUpLabel}`;
    } else {
      fireProjectileVariant(player, px, py, tx, ty, ah, st,      { ...baseOpts, damage:6, hitRadius:12, shotType:'spread', bouncesRemaining:1 });
      fireProjectileVariant(player, px, py, tx, ty, ah + 90, st, { ...baseOpts, damage:6, hitRadius:12, shotType:'spread', bouncesRemaining:1 });
      fireProjectileVariant(player, px, py, tx, ty, Math.max(ah - 90, 30), st, { ...baseOpts, damage:6, hitRadius:12, shotType:'spread', bouncesRemaining:1 });
      statsInfo.abilityLabel = `P${player.id} SPREAD [${METHOD_LABEL[effectiveMode]}]${mods.powerUpLabel}`;
    }
  } else {
    fireProjectileVariant(player, px, py, tx, ty, mods.projectileArcHeight, mods.stepsPerSegment,
      { ...baseOpts, damage:12, hitRadius:16, shotType:'normal' });
    const surgeLabel = (mods.projectileSpeed > PROJECTILE_SPEED_NORMAL && effectiveMode === 'full')
      ? ' [Constant-Speed Surge]' : mods.powerUpLabel;
    statsInfo.abilityLabel = `P${player.id} Projectile [${METHOD_LABEL[effectiveMode]}]${surgeLabel}`;
  }
}

// =====================================================
// 8b. VS AI SYSTEM
// =====================================================

function updateAIPlayer(player, target, dt) {
  const ai  = player.ai;
  const inp = player.aiInput;

  ai.decisionTimer  = Math.max(0, ai.decisionTimer  - dt);
  ai.jumpTimer      = Math.max(0, ai.jumpTimer      - dt);
  ai.attackCooldown = Math.max(0, ai.attackCooldown - dt);

  // Clear all inputs each frame
  inp.left = inp.right = inp.jump = inp.attack = inp.projectile = false;

  if (player.ability.active) return;
  if (player.hitStunTimer > 0) return;

  const pcx  = player.x + player.hitbox.width/2;
  const tcx  = target.x  + target.hitbox.width/2;
  const dx   = tcx - pcx;
  const dist = Math.abs(dx);

  // Movement / attack decisions
  if (dist > 380) {
    dx > 0 ? (inp.right = true) : (inp.left = true);
  } else if (dist < 100) {
    // Back off slightly + attack
    dx > 0 ? (inp.left = true) : (inp.right = true);
    if (ai.attackCooldown <= 0) { inp.attack = true; ai.attackCooldown = 0.6; }
  } else {
    // Medium range: periodic decision
    if (ai.decisionTimer <= 0) {
      const roll = Math.random();
      if (roll < 0.35 && player.cooldowns.projectile <= 0) {
        inp.projectile = true;
      } else if (roll < 0.55) {
        dx > 0 ? (inp.right = true) : (inp.left = true);
      }
      ai.decisionTimer = 0.8 + Math.random() * 1.2;
    }
  }

  // Dash: occasional, direct execution (AI doesn't hold keys)
  if (dist > 180 && dist < 640 && player.cooldowns.dash <= 0) {
    if (Math.random() < 0.007) {
      player.facing = dx > 0 ? 1 : -1;
      player.dashChargeTime = DASH_CHARGE_MIN + Math.random() * 0.55;
      executeDash(player);
    }
  }

  // Occasional jump
  if (player.onGround && ai.jumpTimer <= 0 && Math.random() < 0.012) {
    inp.jump = true;
    ai.jumpTimer = 2.5 + Math.random() * 2.0;
  }

  // Occasionally activate heavy-shot enhancement at medium range
  if (!player.shotEnhanceActive && player.shotEnhanceCooldown <= 0 && dist > 200 && dist < 700) {
    if (Math.random() < 0.003) { player.shotMode = 'heavy'; tryActivateEnhance(player); }
  }
}

function spawnPowerUp() {
  if (GS.powerUps.length >= MAX_FIELD_POWERUPS) return;
  const types = ['constantSpeedSurge', 'curveAmplifier', 'sampleDensityBoost'];
  const type  = types[Math.floor(Math.random() * types.length)];
  const occupied = new Set(GS.powerUps.map(p => `${p.x},${p.y}`));
  const available = POWERUP_SPAWN_POINTS.filter(sp => !occupied.has(`${sp.x},${sp.y - POWERUP_RADIUS}`));
  const pool = available.length > 0 ? available : POWERUP_SPAWN_POINTS;
  const pos  = pool[Math.floor(Math.random() * pool.length)];
  GS.powerUps.push({ x:pos.x, y:pos.y - POWERUP_RADIUS, type, glowPhase:0 });
}

function updatePowerUps(dt) {
  GS.powerUpTimer -= dt;
  if (GS.powerUpTimer <= 0 && GS.powerUps.length < MAX_FIELD_POWERUPS) {
    spawnPowerUp();
    GS.powerUpTimer = POWERUP_SPAWN_INTERVAL_MIN + Math.random() * (POWERUP_SPAWN_INTERVAL_MAX - POWERUP_SPAWN_INTERVAL_MIN);
  }
  for (const pu of GS.powerUps) pu.glowPhase += dt * 2.5;

  for (const player of GS.players) {
    if (player.invulnTimer > 0) continue;
    GS.powerUps = GS.powerUps.filter(pu => {
      const cx = player.x + player.hitbox.width/2;
      const cy = player.y + player.hitbox.height/2;
      const dx = pu.x - cx, dy = pu.y - cy;
      if (Math.sqrt(dx*dx+dy*dy) < POWERUP_RADIUS + 22) {
        applyPowerUp(player, pu);
        return false;
      }
      return true;
    });
  }
}

function applyPowerUp(player, pu) {
  player.powerUp = { type: pu.type, timer: POWERUP_DURATION };
  // Permanent stat boost — no cap, small increments
  const _statKeys = ['projectileSpeedMult','projectileCooldownMult','dashSpeedMult','dashCooldownMult','shieldRegenMult'];
  const _mults    = [1.04, 0.96, 1.04, 0.96, 1.05];
  const _labels   = ['Proj Speed +4%','Proj CD -4%','Dash Speed +4%','Dash CD -4%','Shield Regen +5%'];
  const _idx = Math.floor(Math.random() * _statKeys.length);
  player.statMods[_statKeys[_idx]] *= _mults[_idx];
  GS.floatTexts.push({ x:player.x + player.hitbox.width/2, y:player.y - 60, text:`P${player.id} BOOST: ${_labels[_idx]}`, color:'#ffdd44', life:1.4, maxLife:1.4, size:16 });
}

const PU_LABEL = {
  constantSpeedSurge: 'Constant-Speed Surge',
  curveAmplifier:     'Curve Amplifier',
  sampleDensityBoost: 'Sample Density Boost',
};
const PU_COL = {
  constantSpeedSurge: '#00ffcc',
  curveAmplifier:     '#cc44ff',
  sampleDensityBoost: '#44ff88',
};
const PU_ICON = {
  constantSpeedSurge: 'SPD',
  curveAmplifier:     '~',
  sampleDensityBoost: 'N+',
};

function drawPowerUp(c, pu) {
  const { x, y, type, glowPhase } = pu;
  const r = POWERUP_RADIUS;
  const col = PU_COL[type] || '#ffffff';
  const pulse = 0.55 + 0.45 * Math.sin(glowPhase);
  c.save();
  c.shadowBlur = 18 * pulse; c.shadowColor = col;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
  c.fillStyle = col + '44';
  c.fill();
  c.strokeStyle = col; c.lineWidth = 2.5; c.stroke();
  c.shadowBlur = 0;
  c.fillStyle = '#fff'; c.font = 'bold 13px monospace'; c.textAlign = 'center';
  c.fillText(PU_ICON[type] || '?', x, y + 5);
  c.restore();
}

function stepAbility(player, dt) {
  const ab = player.ability;
  if (!ab.active || ab.type !== 'dash') return;
  const prevDist = ab.distanceTraveled;
  ab.distanceTraveled += ab.speed * dt;
  const tl = totalLen(ab.pathData, ab.mode);
  if (ab.distanceTraveled >= tl) {
    const p = posOnPath(ab.pathData, tl, ab.mode);
    player.x = p.x - player.hitbox.width/2;
    player.y = p.y - player.hitbox.height/2;
    ab.active = false; ab.type = null;
    player.vy = 0;
  } else {
    const p    = posOnPath(ab.pathData, ab.distanceTraveled, ab.mode);
    const prevP = posOnPath(ab.pathData, prevDist, ab.mode);
    const adx = p.x - prevP.x, ady = p.y - prevP.y;
    player.x = p.x - player.hitbox.width/2;
    player.y = p.y - player.hitbox.height/2;
    statsInfo.arcLength    = ab.pathData.totalLength;
    statsInfo.sampledCount = ab.pathData.curvePoints.length;
    statsInfo.distance     = ab.distanceTraveled;
    statsInfo.speed        = ab.speed;
    statsInfo.actualSpeed  = dt > 0 ? Math.sqrt(adx*adx+ady*ady)/dt : ab.speed;
  }
}

function rebuildBouncePath(proj) {
  const opp = GS.players.find(p => p.id !== proj.ownerId);
  if (!opp) return null;
  const tx = opp.x + opp.hitbox.width / 2;
  const ty = opp.y + opp.hitbox.height / 2;
  const fx = tx >= proj.x ? 1 : -1;
  const arcH = 70 + Math.random() * 90;
  return makeProjectilePath(proj.x, proj.y, tx, ty, fx, arcH, STEPS_PER_SEG);
}

function spawnBounceSpark(x, y) {
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 110 + Math.random() * 130;
    GS.hitSparks.push({ x, y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd, life:0.22, maxLife:0.22 });
  }
}

function triggerHeavyBurst(proj, excludePlayerId) {
  const cx = proj.x, cy = proj.y;
  GS.hitSparks.push({ x:cx, y:cy, vx:0, vy:0, life:0.38, maxLife:0.38, explRing:true, maxRadius:HEAVY_IMPACT_RADIUS });
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 170 + Math.random() * 200;
    GS.hitSparks.push({ x:cx, y:cy, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd, life:0.40, maxLife:0.40 });
  }
  triggerScreenShake(4, 0.14);
  for (const player of GS.players) {
    if (player.invulnTimer > 0) continue;
    if (player.id === proj.ownerId) continue;
    if (excludePlayerId && player.id === excludePlayerId) continue;
    const pcx = player.x + player.hitbox.width / 2, pcy = player.y + player.hitbox.height / 2;
    const ddx = pcx - cx, ddy = pcy - cy;
    if (Math.sqrt(ddx*ddx + ddy*ddy) < HEAVY_IMPACT_RADIUS) {
      applyGuardedHit(player, cx, proj.ownerId, {
        damage:HEAVY_IMPACT_DAMAGE, knockbackX:HEAVY_IMPACT_KNOCKBACK,
        knockbackY:-80, stun:HEAVY_IMPACT_STUN, type:'heavy'
      }, false, null, { allowParry: false });
    }
  }
  for (let i = 0; i < HEAVY_SHARD_COUNT; i++) {
    const ang = (i / HEAVY_SHARD_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const stx = cx + Math.cos(ang) * HEAVY_SHARD_PATH_LENGTH;
    const sty = cy + Math.sin(ang) * HEAVY_SHARD_PATH_LENGTH;
    const sf = Math.cos(ang) >= 0 ? 1 : -1;
    const shardPath = makeProjectilePath(cx, cy, stx, sty, sf, 35 + Math.random() * 65, STEPS_PER_SEG);
    GS.projectiles.push({
      active:true, ownerId:proj.ownerId, x:cx, y:cy,
      pathData:shardPath, distanceTraveled:0,
      speed:HEAVY_SHARD_SPEED, mode:proj.mode,
      damage:HEAVY_SHARD_DAMAGE, hitRadius:HEAVY_SHARD_RADIUS,
      shotType:'spread',
      canImpact:false, bouncesRemaining:0, isShard:true, generation:1, justBounced:false,
    });
  }
}

function triggerProjectileImpact(proj, reason, hitPlayerId) {
  if (!proj.active) return;
  if (proj.shotType === 'heavy' && !proj.isShard) {
    triggerHeavyBurst(proj, reason === 'playerHit' ? hitPlayerId : null);
    proj.active = false;
  } else if ((proj.shotType === 'twin' || proj.shotType === 'spread') && !proj.isShard && proj.bouncesRemaining > 0 && reason === 'end') {
    const newPath = rebuildBouncePath(proj);
    if (newPath) {
      proj.pathData = newPath;
      proj.distanceTraveled = 0;
      proj.bouncesRemaining--;
      proj.justBounced = true;
      spawnBounceSpark(proj.x, proj.y);
    } else {
      proj.active = false;
    }
  } else {
    proj.active = false;
  }
}

function stepProjectile(proj, dt) {
  const prevDist = proj.distanceTraveled;
  proj.distanceTraveled += proj.speed * dt;
  const tl = totalLen(proj.pathData, proj.mode);
  if (proj.distanceTraveled >= tl) { triggerProjectileImpact(proj, 'end', null); return; }
  const p    = posOnPath(proj.pathData, proj.distanceTraveled, proj.mode);
  const prevP = posOnPath(proj.pathData, prevDist, proj.mode);
  const adx = p.x - prevP.x, ady = p.y - prevP.y;
  proj.x = p.x; proj.y = p.y;
  statsInfo.arcLength    = proj.pathData.totalLength;
  statsInfo.sampledCount = proj.pathData.curvePoints.length;
  statsInfo.distance     = proj.distanceTraveled;
  statsInfo.speed        = proj.speed;
  statsInfo.actualSpeed  = dt > 0 ? Math.sqrt(adx*adx+ady*ady)/dt : proj.speed;
}

const DEMO_HW = DESIGN_WIDTH / 2;  // half-width

function restartDemo() {
  DS.timer = 0;
  const comp = DS.comparison;

  if (comp === 'powerups') {
    DS.leftEnt = null; DS.rightEnt = null;
    if (!DS.puShowcase) {
      DS.puShowcase = { module:'curveAmplifier', slider:0.5, distance:0, actualSpeed:0, cachedPath:null, cachedModule:null, cachedSlider:null };
    } else {
      DS.puShowcase.distRaw = 0; DS.puShowcase.distMethod = 0;
    }
    return;
  }

  if (comp === 'impact') {
    const impType = (DS.impactShowcase && DS.impactShowcase.type) ? DS.impactShowcase.type : 'heavy';

    // === Left panel: raw (straight-line) primary path ===
    const leftPath = makeProjectilePath(130, 740, DEMO_HW - 200, 740, 1, 160, STEPS_PER_SEG);
    // Actual left endpoint from waypoints
    const leftEndX = DEMO_HW - 200, leftEndY = 740;

    // Raw left effects per shot type
    let leftShardEndpoints = [];
    let leftBouncePaths = [];
    if (impType === 'heavy') {
      // 6 straight-ray endpoints radiating from burst center (no Catmull-Rom)
      for (let i = 0; i < HEAVY_SHARD_COUNT; i++) {
        const ang = (i / HEAVY_SHARD_COUNT) * Math.PI * 2;
        leftShardEndpoints.push({
          x: leftEndX + Math.cos(ang) * 130,
          y: leftEndY + Math.sin(ang) * 130,
        });
      }
    } else if (impType === 'twin') {
      // Two abrupt straight bounces (no arc, no Catmull-Rom)
      const lb1End = { x: 200, y: 530 };
      const lb2End = { x: DEMO_HW - 140, y: 740 };
      leftBouncePaths = [
        { linearSegments: [{ x: leftEndX, y: leftEndY }, lb1End] },
        { linearSegments: [lb1End, lb2End] },
      ];
    } else { // spread
      // One abrupt straight bounce
      const lb1End = { x: 190, y: 590 };
      leftBouncePaths = [
        { linearSegments: [{ x: leftEndX, y: leftEndY }, lb1End] },
      ];
    }

    // === Right panel: Catmull-Rom primary path + numerical impact ===
    const rightPrimary = makeProjectilePath(DEMO_HW + 130, 740, DESIGN_WIDTH - 200, 740, 1, 160, STEPS_PER_SEG);
    const endPt = rightPrimary.curvePoints[rightPrimary.curvePoints.length - 1];
    const shardPaths = [], bouncePaths = [];
    if (impType === 'heavy') {
      for (let i = 0; i < HEAVY_SHARD_COUNT; i++) {
        const ang = (i / HEAVY_SHARD_COUNT) * Math.PI * 2;
        const stx = endPt.x + Math.cos(ang) * HEAVY_SHARD_PATH_LENGTH;
        const sty = endPt.y + Math.sin(ang) * HEAVY_SHARD_PATH_LENGTH;
        shardPaths.push(makeProjectilePath(endPt.x, endPt.y, stx, sty, Math.cos(ang)>=0?1:-1, 30 + i*12, STEPS_PER_SEG));
      }
    } else if (impType === 'twin') {
      const b1 = makeProjectilePath(endPt.x, endPt.y, DEMO_HW + 200, 520, -1, 110, STEPS_PER_SEG);
      const b1e = b1.curvePoints[b1.curvePoints.length - 1];
      const b2 = makeProjectilePath(b1e.x, b1e.y, DESIGN_WIDTH - 180, 740, 1, 75, STEPS_PER_SEG);
      bouncePaths.push(b1, b2);
    } else {
      bouncePaths.push(makeProjectilePath(endPt.x, endPt.y, DEMO_HW + 260, 550, -1, 90, STEPS_PER_SEG));
    }

    DS.impactShowcase = {
      type: impType,
      // Left panel state
      leftDist: 0, leftPhase: 'primary', leftDone: false,
      leftBurstTimer: 0,
      leftActiveBouncePath: 0, leftBounceActiveDist: 0,
      leftPath, leftShardEndpoints, leftBouncePaths,
      // Right panel state
      rightDist: 0, rightPhase: 'primary',
      burstTimer: 0,
      rightPrimary, bouncePaths, shardPaths,
      rightActiveBouncePath: 0, rightBounceActiveDist: 0,
    };
    DS.leftEnt = null; DS.rightEnt = null;
    return;
  }

  if (comp === 'meteor') {
    // Left panel: 4 waypoints in x:[100..870], linear mode — angular, equal-time movement
    const lwpts = [{x:100,y:80},{x:250,y:260},{x:650,y:510},{x:870,y:870}];
    const lcpts = buildCurve(lwpts, STEPS_PER_SEG);
    const larcs = computeArcLengths(lcpts);
    const lpd = { waypoints:lwpts, curvePoints:lcpts, arcLengths:larcs, totalLength:larcs[larcs.length-1], linearSegments:lwpts };
    // Right panel: same shape offset into right half, full method — smooth + constant-speed
    const rwpts = lwpts.map(p => ({x:p.x+DEMO_HW, y:p.y}));
    const rcpts = buildCurve(rwpts, STEPS_PER_SEG);
    const rarcs = computeArcLengths(rcpts);
    const rpd = { waypoints:rwpts, curvePoints:rcpts, arcLengths:rarcs, totalLength:rarcs[rarcs.length-1], linearSegments:rwpts };
    const rightMode = GS.methodMode === 'linear' ? 'full' : GS.methodMode;
    DS.leftEnt  = { x:lwpts[0].x, y:lwpts[0].y, distanceTraveled:0, pathData:lpd, mode:'linear',  speed:680, done:false, type:'meteor', warningTimer:1.5 };
    DS.rightEnt = { x:rwpts[0].x, y:rwpts[0].y, distanceTraveled:0, pathData:rpd, mode:rightMode, speed:680, done:false, type:'meteor', warningTimer:1.5 };
    return;
  }

  // Left panel (linear mode) — entities live in x:[50..DEMO_HW-50]
  const lp = { x:120, y:820, hitbox:{width:40,height:70}, facing:1 };
  const lt = { x:DEMO_HW-220, y:820, hitbox:{width:40,height:70}, facing:1 };

  // Right panel (full mode) — entities live in x:[DEMO_HW+50..DESIGN_WIDTH-50]
  const rp = { x:DEMO_HW+120, y:820, hitbox:{width:40,height:70}, facing:1 };
  const rt = { x:DESIGN_WIDTH-220, y:820, hitbox:{width:40,height:70}, facing:1 };

  const lpx = lp.x+20, lpy = lp.y+35, ltx = lt.x+20, lty = lt.y+35;
  const rpx = rp.x+20, rpy = rp.y+35, rtx = rt.x+20, rty = rt.y+35;

  let lpd, rpd;
  if (comp === 'dash') {
    lpd = makeDashPathDir(lpx, lpy, 1, 460);
    rpd = makeDashPathDir(rpx, rpy, 1, 460);
  } else {
    lpd = makeProjectilePath(lpx, lpy, ltx, lty, 1);
    rpd = makeProjectilePath(rpx, rpy, rtx, rty, 1);
  }

  const rightMode = GS.methodMode === 'linear' ? 'full' : GS.methodMode;
  DS.leftEnt  = { x:lpx, y:lpy, distanceTraveled:0, pathData:lpd, mode:'linear',   speed:comp==='dash'?650:540, done:false, type:comp };
  DS.rightEnt = { x:rpx, y:rpy, distanceTraveled:0, pathData:rpd, mode:rightMode,  speed:comp==='dash'?650:540, done:false, type:comp };
}

function stepDemoEnt(ent, dt) {
  if (ent.done) return;
  if (ent.warningTimer !== undefined && ent.warningTimer > 0) { ent.warningTimer -= dt; return; }
  ent.distanceTraveled += ent.speed * dt;
  const tl = totalLen(ent.pathData, ent.mode);
  if (ent.distanceTraveled >= tl) { ent.distanceTraveled = tl; ent.done = true; return; }
  const p = posOnPath(ent.pathData, ent.distanceTraveled, ent.mode);
  ent.x = p.x; ent.y = p.y;
}

function updateImpactShowcase(dt) {
  const sh = DS.impactShowcase;
  if (!sh) return;
  const ISPEED = 460;

  // === Left panel (raw) ===
  if (sh.leftPhase === 'primary') {
    sh.leftDist += ISPEED * dt;
    const lTotal = linearSegLen(sh.leftPath.linearSegments);
    if (sh.leftDist >= lTotal) {
      sh.leftDist = lTotal;
      if (sh.type === 'heavy') {
        sh.leftPhase = 'rawburst'; sh.leftBurstTimer = 1.5;
      } else if (sh.leftBouncePaths && sh.leftBouncePaths.length > 0) {
        sh.leftPhase = 'rawbounce'; sh.leftActiveBouncePath = 0; sh.leftBounceActiveDist = 0;
      } else {
        sh.leftPhase = 'done'; sh.leftDone = true;
      }
    }
  } else if (sh.leftPhase === 'rawburst') {
    sh.leftBurstTimer -= dt;
    if (sh.leftBurstTimer <= 0) { sh.leftPhase = 'done'; sh.leftDone = true; }
  } else if (sh.leftPhase === 'rawbounce') {
    sh.leftBounceActiveDist += ISPEED * dt;
    const curLP = sh.leftBouncePaths[sh.leftActiveBouncePath];
    const curLLen = linearSegLen(curLP.linearSegments);
    if (sh.leftBounceActiveDist >= curLLen) {
      sh.leftBounceActiveDist = curLLen;
      const nxtL = sh.leftActiveBouncePath + 1;
      if (nxtL < sh.leftBouncePaths.length) {
        sh.leftActiveBouncePath = nxtL; sh.leftBounceActiveDist = 0;
      } else {
        sh.leftPhase = 'done'; sh.leftDone = true;
      }
    }
  }

  // === Right panel (numerical) ===
  if (sh.rightPhase === 'primary') {
    sh.rightDist += ISPEED * dt;
    if (sh.rightDist >= sh.rightPrimary.totalLength) {
      sh.rightDist = sh.rightPrimary.totalLength;
      if (sh.type === 'heavy') { sh.rightPhase = 'burst'; sh.burstTimer = 1.8; }
      else if (sh.bouncePaths.length > 0) { sh.rightPhase = 'bounce'; sh.rightActiveBouncePath = 0; sh.rightBounceActiveDist = 0; }
      else { sh.rightPhase = 'done'; }
    }
  } else if (sh.rightPhase === 'burst') {
    sh.burstTimer -= dt;
    if (sh.burstTimer <= 0) sh.rightPhase = 'done';
  } else if (sh.rightPhase === 'bounce') {
    sh.rightBounceActiveDist += ISPEED * dt;
    const curP = sh.bouncePaths[sh.rightActiveBouncePath];
    if (sh.rightBounceActiveDist >= curP.totalLength) {
      sh.rightBounceActiveDist = curP.totalLength;
      const nxt = sh.rightActiveBouncePath + 1;
      if (nxt < sh.bouncePaths.length) { sh.rightActiveBouncePath = nxt; sh.rightBounceActiveDist = 0; }
      else { sh.rightPhase = 'done'; }
    }
  }

  if (sh.leftDone && sh.rightPhase === 'done' && DS.timer > 4.5) restartDemo();
}

function getDemoCycleDuration() {
  if (DS.comparison === 'meteor')  return 5.0;
  if (DS.comparison === 'impact')  return 4.5;
  if (DS.comparison === 'powerups') return 999; // power-up showcase loops internally
  return DS.cycleDuration;
}

function updateDemoLab(dt) {
  if (DS.comparison === 'powerups') {
    DS.timer += dt;
    updatePowerUpShowcase(dt);
    return;
  }
  if (DS.comparison === 'impact') {
    DS.timer += dt;
    updateImpactShowcase(dt);
    return;
  }
  if (!DS.leftEnt) { restartDemo(); return; }
  stepDemoEnt(DS.leftEnt, dt);
  stepDemoEnt(DS.rightEnt, dt);
  DS.timer += dt;
  if (DS.timer >= getDemoCycleDuration()) restartDemo();
}

// =====================================================
// 10. COLLISION AND HIT DETECTION
// =====================================================

function aabbOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function checkAttack(atk, def) {
  if (!atk.attackActive) return;
  if (atk.attackHitIds.has(def.id)) return;
  const aw = atk.hitbox.width, ah = atk.hitbox.height;
  const ax = atk.x + (atk.facing > 0 ? aw : -aw);
  if (aabbOverlap(ax, atk.y, aw, ah, def.x, def.y, def.hitbox.width, def.hitbox.height)) {
    atk.attackHitIds.add(def.id);
    applyGuardedHit(def, atk.x + aw / 2, atk.id, { ...HIT_DATA.attack, type:'attack' }, false, null);
  }
}

function checkDashHit(player, opponents) {
  if (!player.ability.active || player.ability.type !== 'dash') return;
  for (const opp of opponents) {
    if (opp.id === player.id) continue;
    if (aabbOverlap(player.x, player.y, player.hitbox.width, player.hitbox.height,
                    opp.x, opp.y, opp.hitbox.width, opp.hitbox.height)) {
      applyGuardedHit(opp, player.x + player.hitbox.width / 2, player.id, { ...HIT_DATA.dash, type:'dash' }, false, null);
      player.ability.active = false;
    }
  }
}

function checkProjHits(proj, players) {
  if (proj.justBounced) { proj.justBounced = false; return; }
  for (const p of players) {
    if (p.id === proj.ownerId) continue;
    const cx = p.x + p.hitbox.width/2, cy = p.y + p.hitbox.height/2;
    const dx = proj.x - cx, dy = proj.y - cy;
    if (Math.sqrt(dx*dx+dy*dy) < proj.hitRadius + 22) {
      const st = proj.shotType || 'normal';
      const result = applyGuardedHit(p, proj.x, proj.ownerId, { ...(HIT_DATA[st] || HIT_DATA.normal), type:st }, true, proj);
      if (result !== 'parried') triggerProjectileImpact(proj, 'playerHit', p.id);
      return;
    }
  }
}

function respawnPlayer(player) {
  player.x = player.id===1 ? SPAWN.p1.x : SPAWN.p2.x;
  player.y = player.id===1 ? SPAWN.p1.y : SPAWN.p2.y;
  player.vx = 0; player.vy = 0;
  player.health = 100;
  player.ability = { active:false, type:null, pathData:null, distanceTraveled:0, speed:0, mode:'full' };
  player.dashCharging = false; player.dashChargeTime = 0; player.dashPreviewPath = null;
  player.attackActive = false; player.attackTimer = 0;
  player.attackHitIds.clear();
  player.invulnTimer = 1.5;
  player.hitFlash = 0;
  player.hitStunTimer = 0;
  player.shield = SHIELD_MAX;
  player.guarding = false; player.guardPressedTimer = 0; player.guardBrokenTimer = 0;
  player.parryFlash = 0;
}

function loseStock(player, fromId) {
  player.stocks = Math.max(0, player.stocks - 1);
  if (player.stocks === 0) {
    GS.winner = fromId;
  } else {
    respawnPlayer(player);
  }
}

function damage(player, amount, fromId) {
  if (player.health <= 0 || player.invulnTimer > 0) return;
  player.health = Math.max(0, player.health - amount);
  player.hitFlash = 0.18;
  if (player.health === 0) loseStock(player, fromId);
}

function spawnHitSpark(x, y, type) {
  const count = type === 'dash' ? 10 : type === 'heavy' ? 8 : 5;
  const spd   = type === 'dash' ? 380 : type === 'heavy' ? 300 : 200;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = spd * (0.5 + Math.random() * 0.5);
    GS.hitSparks.push({ x, y, vx:Math.cos(angle)*s, vy:Math.sin(angle)*s, life:0.35, maxLife:0.35 });
  }
}

function triggerScreenShake(strength, duration) {
  if (strength > screenShake.strength || screenShake.timer <= 0) {
    screenShake.strength = strength; screenShake.timer = duration;
  }
}

function applyHit(target, sourceX, sourceId, hitData) {
  if (target.health <= 0 || target.invulnTimer > 0) return;
  target.health = Math.max(0, target.health - hitData.damage);
  target.hitFlash = 0.18;
  const dir = (target.x + target.hitbox.width / 2) >= sourceX ? 1 : -1;
  target.vx = dir * hitData.knockbackX;
  target.vy = hitData.knockbackY;
  if (target.ability.active) { target.ability.active = false; target.ability.type = null; }
  target.hitStunTimer = hitData.stun || 0;
  spawnHitSpark(target.x + target.hitbox.width / 2, target.y + target.hitbox.height / 2, hitData.type || 'hit');
  const shakeMap = { dash:{s:4,t:0.12}, heavy:{s:3,t:0.10}, attack:{s:2,t:0.08} };
  const sk = shakeMap[hitData.type] || { s:1.5, t:0.07 };
  triggerScreenShake(sk.s, sk.t);
  if (target.health === 0) loseStock(target, sourceId);
}

function checkProjClash() {
  const projs = GS.projectiles;
  for (let i = 0; i < projs.length; i++) {
    if (!projs[i].active) continue;
    for (let j = i + 1; j < projs.length; j++) {
      if (!projs[j].active || projs[i].ownerId === projs[j].ownerId) continue;
      const dx = projs[i].x - projs[j].x, dy = projs[i].y - projs[j].y;
      if (Math.sqrt(dx*dx+dy*dy) < projs[i].hitRadius + projs[j].hitRadius) {
        spawnHitSpark((projs[i].x+projs[j].x)/2, (projs[i].y+projs[j].y)/2, 'hit');
        triggerScreenShake(1.5, 0.06);
        triggerProjectileImpact(projs[i], 'clash', null);
        if (!projs[i].active) break;  // heavy burst deactivates i; stop checking i vs further j
        triggerProjectileImpact(projs[j], 'clash', null);
      }
    }
  }
}

function updateHitSparks(dt) {
  for (const sp of GS.hitSparks) {
    sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    sp.vx *= 0.88; sp.vy *= 0.88;
    sp.life -= dt;
  }
  GS.hitSparks = GS.hitSparks.filter(sp => sp.life > 0);
}

// =====================================================
// 10b. SHIELD AND PARRY SYSTEM
// =====================================================

function isParryActive(player) {
  return player.guarding && player.guardPressedTimer <= PARRY_WINDOW
      && player.shield > 0 && player.guardBrokenTimer <= 0;
}

function spawnParrySpark(x, y) {
  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2;
    const s = 300 + Math.random() * 200;
    GS.hitSparks.push({ x, y, vx:Math.cos(angle)*s, vy:Math.sin(angle)*s, life:0.55, maxLife:0.55, parry:true });
  }
}

function spawnBlockSpark(x, y) {
  for (let i = 0; i < 7; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = 120 + Math.random() * 80;
    GS.hitSparks.push({ x, y, vx:Math.cos(angle)*s, vy:Math.sin(angle)*s, life:0.25, maxLife:0.25, block:true });
  }
}

function reflectProjectile(proj, defender, attacker) {
  const defCX = defender.x + defender.hitbox.width / 2;
  const defCY = defender.y + defender.hitbox.height / 2;
  let atkCX, atkCY;
  if (attacker) {
    atkCX = attacker.x + attacker.hitbox.width / 2;
    atkCY = attacker.y + attacker.hitbox.height / 2;
  } else {
    const opp = GS.players.find(p => p.id !== defender.id);
    atkCX = opp ? opp.x + opp.hitbox.width / 2 : defCX + 400 * defender.facing;
    atkCY = opp ? opp.y + opp.hitbox.height / 2 : defCY;
  }
  const newFacing = atkCX >= defCX ? 1 : -1;
  const arcH = Math.max(100, Math.abs(defCY - atkCY) * 0.4 + 120);
  const steps = Math.max(30, STEPS_PER_SEG);
  const mode  = proj.mode || GS.methodMode;
  // Rebuild a fresh Catmull-Rom path from parry point toward attacker
  const newPath = makeProjectilePath(defCX, defCY, atkCX, atkCY, newFacing, arcH, steps);
  proj.ownerId          = defender.id;
  proj.pathData         = newPath;
  proj.distanceTraveled = 0;
  proj.x = defCX; proj.y = defCY;
  proj.speed   = proj.speed * 1.1;
  proj.reflected = true;
  proj.active  = true;
}

function handleParry(target, sourceId, hitData, isProj, projRef) {
  target.parryFlash = 0.4;
  spawnParrySpark(target.x + target.hitbox.width / 2, target.y + target.hitbox.height / 2);
  triggerScreenShake(2.5, 0.10);
  // Stun and push attacker back
  const attacker = GS.players.find(p => p.id === sourceId);
  if (attacker) {
    const stunDur = hitData.type === 'dash' ? 0.35 : 0.25;
    const dir = (attacker.x + attacker.hitbox.width / 2) >= (target.x + target.hitbox.width / 2) ? 1 : -1;
    attacker.vx = dir * 220;
    attacker.vy = -80;
    attacker.hitStunTimer = Math.max(attacker.hitStunTimer, stunDur);
    if (hitData.type === 'dash') { attacker.ability.active = false; attacker.ability.type = null; }
  }
  if (isProj && projRef) reflectProjectile(projRef, target, attacker || null);
}

function applyGuardedHit(target, sourceX, sourceId, hitData, isProj, projRef, opts) {
  if (target.health <= 0 || target.invulnTimer > 0) return 'ignored';
  const allowParry = !opts || opts.allowParry !== false;
  // Perfect parry
  if (allowParry && isParryActive(target)) {
    handleParry(target, sourceId, hitData, isProj, projRef);
    return 'parried';
  }
  // Normal block
  if (target.guarding && target.shield > 0 && target.guardBrokenTimer <= 0) {
    const dmg = Math.max(1, Math.round(hitData.damage * SHIELD_DAMAGE_MULT));
    target.health = Math.max(0, target.health - dmg);
    target.hitFlash = 0.1;
    target.shield = Math.max(0, target.shield - hitData.damage * 1.2);
    const dir = (target.x + target.hitbox.width / 2) >= sourceX ? 1 : -1;
    target.vx = dir * hitData.knockbackX * SHIELD_KNOCKBACK_MULT;
    target.vy = hitData.knockbackY * SHIELD_KNOCKBACK_MULT;
    target.hitStunTimer = (hitData.stun || 0) * 0.5;
    spawnBlockSpark(target.x + target.hitbox.width / 2, target.y + target.hitbox.height / 2);
    triggerScreenShake(1, 0.05);
    if (target.shield <= 0) {
      target.shield = 0;
      target.guarding = false;
      target.guardBrokenTimer = GUARD_BREAK_STUN;
      target.hitStunTimer = Math.max(target.hitStunTimer, GUARD_BREAK_STUN);
      spawnHitSpark(target.x + target.hitbox.width / 2, target.y + target.hitbox.height / 2, 'dash');
      triggerScreenShake(3, 0.15);
    }
    if (target.health === 0) loseStock(target, sourceId);
    return 'blocked';
  }
  // Unguarded — normal hit
  applyHit(target, sourceX, sourceId, hitData);
  return 'hit';
}

function updateGuard(player, dt) {
  if (player.isAI || player.isDummy) {
    player.guarding = false; player.guardPressedTimer = 0;
    return;
  }
  if (player.guardBrokenTimer > 0) {
    player.guardBrokenTimer = Math.max(0, player.guardBrokenTimer - dt);
    player.guarding = false; player.guardPressedTimer = 0;
    player.shield = Math.min(SHIELD_MAX, player.shield + SHIELD_REGEN_PER_SEC * player.statMods.shieldRegenMult * 0.25 * dt);
    return;
  }
  const guardKey = getInput(player, 'guard');
  const canGuard = player.hitStunTimer <= 0 && player.guardBrokenTimer <= 0;
  if (guardKey && canGuard) {
    if (!player.guarding) player.guardPressedTimer = 0; // fresh press
    player.guarding = true;
    player.guardPressedTimer += dt;
    player.shield = Math.max(0, player.shield - SHIELD_DRAIN_PER_SEC * dt);
    if (player.shield <= 0) {
      player.shield = 0; player.guarding = false; player.guardPressedTimer = 0;
      player.guardBrokenTimer = GUARD_BREAK_STUN;
      player.hitStunTimer = Math.max(player.hitStunTimer, GUARD_BREAK_STUN);
      spawnHitSpark(player.x + player.hitbox.width / 2, player.y + player.hitbox.height / 2, 'dash');
      triggerScreenShake(3, 0.15);
    }
  } else {
    player.guarding = false; player.guardPressedTimer = 0;
    player.shield = Math.min(SHIELD_MAX, player.shield + SHIELD_REGEN_PER_SEC * player.statMods.shieldRegenMult * dt);
  }
}

// =====================================================
// 10c. METEOR / METHOD STORM SYSTEM
// =====================================================

function getStormLevel() {
  const t = GS.matchTime;
  if (t < STORM_L2_TIME) return 1;
  if (t < STORM_L3_TIME) return 2;
  if (t < STORM_L4_TIME) return 3;
  return 4;
}

function getMeteorSpawnConfig() {
  const level = getStormLevel();
  if (level === 1) return { intervalMin:12,  intervalMax:15,  maxActive:1 };
  if (level === 2) return { intervalMin:8,   intervalMax:11,  maxActive:2 };
  if (level === 3) return { intervalMin:5.5, intervalMax:8,   maxActive:3 };
  return           { intervalMin:3.8, intervalMax:5.5, maxActive:4 };
}

function triggerMeteorExplosion(cx, cy, excludeOwnerId) {
  // Expanding blast ring
  GS.hitSparks.push({ x:cx, y:cy, vx:0, vy:0, life:0.40, maxLife:0.40, explRing:true, maxRadius:METEOR_EXPLOSION_RADIUS });
  // Particle sparks
  for (let i = 0; i < 24; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 320 + Math.random() * 260;
    GS.hitSparks.push({ x:cx, y:cy, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd, life:0.55, maxLife:0.55, meteor:true });
  }
  triggerScreenShake(7.5, 0.25);
  for (const player of GS.players) {
    if (player.invulnTimer > 0) continue;
    if (excludeOwnerId !== 0 && player.id === excludeOwnerId) continue;
    const pcx = player.x + player.hitbox.width/2;
    const pcy = player.y + player.hitbox.height/2;
    const dx = pcx - cx, dy = pcy - cy;
    if (Math.sqrt(dx*dx + dy*dy) < METEOR_EXPLOSION_RADIUS) {
      applyGuardedHit(player, cx, 0, {
        damage:METEOR_EXPLOSION_DAMAGE, knockbackX:METEOR_EXPLOSION_KNOCKBACK,
        knockbackY:-120, stun:METEOR_EXPLOSION_STUN, type:'meteor'
      }, false, null, { allowParry: false });
    }
  }
}

function updateFloatTexts(dt) {
  for (const ft of GS.floatTexts) { ft.y -= 40 * dt; ft.life -= dt; }
  GS.floatTexts = GS.floatTexts.filter(ft => ft.life > 0);
}

function spawnMeteor() {
  const pd = makeMeteorPath();
  const start = pd.curvePoints[0];
  GS.meteors.push({
    active:true, phase:'warning', ownerId:0, reflected:false,
    pathData:pd, distanceTraveled:0, warningTimer:METEOR_WARNING_TIME,
    speed:METEOR_SPEED, radius:METEOR_RADIUS, x:start.x, y:start.y,
    color:'#ffee66', mode:'full',
  });
}

function reflectMeteor(meteor, defender) {
  const defCX = defender.x + defender.hitbox.width  / 2;
  const defCY = defender.y + defender.hitbox.height / 2;
  const opp = GS.players.find(p => p.id !== defender.id);
  const atkCX = opp ? opp.x + opp.hitbox.width  / 2 : defCX + 500 * defender.facing;
  const atkCY = opp ? opp.y + opp.hitbox.height / 2 : defCY;
  const newFacing = atkCX >= defCX ? 1 : -1;
  const arcH = Math.max(120, Math.abs(defCY - atkCY) * 0.3 + 150);
  // Rebuild fresh Catmull-Rom path from parry point toward opponent (same pipeline as player projectiles)
  const newPath = makeProjectilePath(defCX, defCY, atkCX, atkCY, newFacing, arcH, STEPS_PER_SEG);
  meteor.pathData         = newPath;
  meteor.distanceTraveled = 0;
  meteor.x = defCX; meteor.y = defCY;
  meteor.speed    = METEOR_SPEED * 1.1;
  meteor.ownerId  = defender.id;
  meteor.reflected = true;
  meteor.color    = defender.color;
  meteor.phase    = 'falling';
}

function updateMeteors(dt) {
  const cfg = getMeteorSpawnConfig();
  GS.meteorTimer -= dt;
  if (GS.meteorTimer <= 0) {
    const activeCount = GS.meteors.filter(m => m.active).length;
    if (activeCount < cfg.maxActive) spawnMeteor();
    GS.meteorTimer = cfg.intervalMin + Math.random() * (cfg.intervalMax - cfg.intervalMin);
  }
  for (const m of GS.meteors) {
    if (!m.active) continue;
    if (m.phase === 'warning') { m.warningTimer -= dt; if (m.warningTimer <= 0) m.phase = 'falling'; continue; }
    // Move along Catmull-Rom path with arc-length reparameterization (Full mode pipeline)
    m.distanceTraveled += m.speed * dt;
    if (m.distanceTraveled >= m.pathData.totalLength) {
      triggerMeteorExplosion(m.x, m.y, m.ownerId);
      m.active = false; continue;
    }
    const p = getPositionAtDistance(m.pathData.curvePoints, m.pathData.arcLengths, m.distanceTraveled);
    m.x = p.x; m.y = p.y;
    // Collision
    for (const player of GS.players) {
      if (player.invulnTimer > 0) continue;
      if (m.reflected && m.ownerId === player.id) continue;
      const cx = player.x + player.hitbox.width/2, cy = player.y + player.hitbox.height/2;
      const dx = m.x - cx, dy = m.y - cy;
      if (Math.sqrt(dx*dx+dy*dy) < m.radius + 22) {
        const result = applyGuardedHit(player, m.x, m.ownerId, { ...HIT_DATA.meteor, type:'meteor' }, false, null);
        if (result === 'parried') { reflectMeteor(m, player); }
        else { triggerMeteorExplosion(m.x, m.y, m.ownerId); m.active = false; }
        break;
      }
    }
  }
  GS.meteors = GS.meteors.filter(m => m.active);
}

// =====================================================
// 11. UPDATE LOOP
// =====================================================

let prevTime = 0;

function update(ts) {
  const dt = Math.min((ts - prevTime) / 1000, 0.05);
  prevTime = ts;

  // Menu animation — always runs so transitions play even while gameplay is frozen
  if (UI.menuPhase === 'opening') {
    UI.menuAnim = Math.min(1, UI.menuAnim + dt / MENU_OPEN_TIME);
    if (UI.menuAnim >= 1) { UI.menuPhase = 'active'; UI.menuAnim = 1; }
  } else if (UI.menuPhase === 'closing') {
    UI.menuAnim = Math.max(0, UI.menuAnim - dt / MENU_CLOSE_TIME);
    if (UI.menuAnim <= 0) { UI.menuPhase = 'closed'; UI.menuOpen = false; UI.menuAnim = 0; }
  }
  if (UI.menuPhase === 'opening' || UI.menuPhase === 'active' || UI.menuPhase === 'closing') {
    UI.flickerPulse = Math.sin(Date.now() * 0.003) * 0.5 + 0.5;
    if (UI.remoteTimer > 0) {
      UI.remoteTimer = Math.max(0, UI.remoteTimer - dt);
      if (UI.remoteTimer <= 0) { UI.remoteState = 'idle'; UI.remoteBounce = 0; }
    }
    if (UI.remoteState !== 'idle') {
      UI.remoteBounce = Math.min(1, UI.remoteBounce + dt / 0.15);
    }
    if (UI.selectFlash > 0) UI.selectFlash = Math.max(0, UI.selectFlash - dt);
    updateMenuEffects(dt);
  }
  if (UI.menuOpen) return; // paused — prevTime still advances so dt won't spike on close
  if (GS.mode === 'demoLab') { updateDemoLab(dt); return; }
  if (GS.winner) return;

  const [p1, p2] = GS.players;

  // Match timer + storm escalation
  const _prevStormLv = getStormLevel();
  GS.matchTime += dt;
  GS.stormLevel = getStormLevel();
  if (GS.stormLevel > _prevStormLv) {
    GS.floatTexts.push({ x:DESIGN_WIDTH/2, y:DESIGN_HEIGHT/2-50, text:`STORM LEVEL ${GS.stormLevel}`, color:'#ff8833', life:2.0, maxLife:2.0, size:30 });
    GS.floatTexts.push({ x:DESIGN_WIDTH/2, y:DESIGN_HEIGHT/2-10, text:'More meteors incoming', color:'#cc6622', life:2.0, maxLife:2.0, size:20 });
  }

  // Timers / cooldowns
  for (const p of [p1, p2]) {
    for (const k in p.cooldowns) { p.cooldowns[k] = Math.max(0, p.cooldowns[k] - dt); }
    if (p.attackTimer > 0) { p.attackTimer -= dt; if (p.attackTimer <= 0) p.attackActive = false; }
    if (p.hitFlash     > 0) p.hitFlash     -= dt;
    if (p.invulnTimer  > 0) p.invulnTimer   -= dt;
    if (p.hitStunTimer > 0) p.hitStunTimer = Math.max(0, p.hitStunTimer - dt);
    if (p.parryFlash  > 0) p.parryFlash  = Math.max(0, p.parryFlash  - dt);
    if (p.powerUp) { p.powerUp.timer -= dt; if (p.powerUp.timer <= 0) p.powerUp = null; }
    if (p.shotEnhanceActive) {
      p.shotEnhanceTimer -= dt;
      if (p.shotEnhanceTimer <= 0) { p.shotEnhanceActive = false; p.shotEnhanceCooldown = SHOT_ENHANCE_COOLDOWN; }
    } else if (p.shotEnhanceCooldown > 0) {
      p.shotEnhanceCooldown = Math.max(0, p.shotEnhanceCooldown - dt);
    }
  }
  if (screenShake.timer > 0) screenShake.timer = Math.max(0, screenShake.timer - dt);
  updateHitSparks(dt);
  updateFloatTexts(dt);

  // Power-ups
  updatePowerUps(dt);

  // Guard update — must run before meteor collision so parry state is ready on same frame
  updateGuard(p1, dt);
  updateGuard(p2, dt);

  // Meteor / Method Storm
  updateMeteors(dt);

  // AI update — writes aiInput before physics/ability reads
  if (p2.isAI) updateAIPlayer(p2, p1, dt);

  // Online relay — send local player's intent, apply peer's into the remote
  // player's netInput (read via getInput downstream). Non-authoritative.
  if (GS.mode === 'online' && window.SplineNet && SplineNet.isConnected() && SplineNet.state.peerPresent) {
    const slot    = SplineNet.state.slot;
    const localP  = slot === 'p2' ? p2 : p1;
    const remoteP = slot === 'p2' ? p1 : p2;
    SplineNet.sendInput({
      left:       isDown(localP.controls.left),
      right:      isDown(localP.controls.right),
      jump:       isDown(localP.controls.jump),
      attack:     isDown(localP.controls.attack),
      dash:       isDown(localP.controls.dash),
      projectile: isDown(localP.controls.projectile),
      guard:      isDown(localP.controls.guard),
    });
    const ri = SplineNet.remoteInput || {};
    const ni = remoteP.netInput;
    ni.left = !!ri.left; ni.right = !!ri.right; ni.jump = !!ri.jump;
    ni.attack = !!ri.attack; ni.dash = !!ri.dash;
    ni.projectile = !!ri.projectile; ni.guard = !!ri.guard;
  }

  // Dash charge — human players only; AI uses executeDash directly
  updateDashCharge(p1, dt);
  if (!p2.isAI) updateDashCharge(p2, dt);

  // Non-dash abilities from input
  function inputAbilities(player, target) {
    if (player.isDummy || player.ability.active || player.hitStunTimer > 0 || player.guarding || player.guardBrokenTimer > 0) return;
    if (getInput(player, 'projectile') && player.cooldowns.projectile <= 0) tryProjectile(player, target);
    if (getInput(player, 'attack') && player.attackTimer <= 0) {
      player.attackActive = true; player.attackTimer = 0.22;
      player.attackHitIds.clear();
    }
  }
  inputAbilities(p1, p2);
  inputAbilities(p2, p1);

  // Jumps
  tryJump(p1);
  tryJump(p2);

  // Physics
  physicsStep(p1, dt);
  physicsStep(p2, dt);

  // Ability movement
  stepAbility(p1, dt);
  stepAbility(p2, dt);

  // Projectiles
  for (const proj of GS.projectiles) stepProjectile(proj, dt);
  GS.projectiles = GS.projectiles.filter(p => p.active);

  // Hits
  checkAttack(p1, p2);
  checkAttack(p2, p1);
  checkDashHit(p1, GS.players);
  checkDashHit(p2, GS.players);
  checkProjClash();
  for (const proj of GS.projectiles) checkProjHits(proj, GS.players);
  GS.projectiles = GS.projectiles.filter(p => p.active);

  // Auto-face opponent (skip during dash charge so player can steer direction)
  if (!p1.ability.active && !p1.dashCharging) p1.facing = p2.x > p1.x ? 1 : -1;
  if (!p2.isDummy && !p2.isAI && !p2.ability.active && !p2.dashCharging) p2.facing = p1.x > p2.x ? 1 : -1;

  GS.frameCount++;
}
